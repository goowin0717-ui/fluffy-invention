<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>API サンプル</title>
</head>
<body>

    <h1>Web API からデータ取得</h1>
    <button id="load-btn">データを読み込む</button>
    <div id="result" style="margin-top: 20px;"></div>

    <script>
        // ボタンと結果を表示する要素を取得
        const button = document.getElementById('load-btn');
        const resultDiv = document.getElementById('result');

        // ボタンがクリックされたときの処理
        button.addEventListener('click', () => {
            resultDiv.textContent = '読み込み中...';

            // 無料で使えるテスト用APIのURL
            const url = 'https://typicode.com';

            // Fetch APIでデータを取得
            fetch(url)
                .then(response => {
                    // エラーチェック
                    if (!response.ok) {
                        throw new Error('データの取得に失敗しました');
                    }
                    return response.json(); // JSON形式に変換
                })
                .then(data => {
                    // 取得したデータを画面に表示
                    resultDiv.innerHTML = `
                        <p><strong>ID:</strong> ${data.id}</p>
                        <p><strong>タイトル:</strong> ${data.title}</p>
                        <p><strong>完了状態:</strong> ${data.completed ? '完了' : '未完了'}</p>
                    `;
                })
                .catch(error => {
                    // エラー処理
                    resultDiv.textContent = `エラーが発生しました: ${error.message}`;
                });
        });
    </script>

</body>
</html>
