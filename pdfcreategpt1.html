<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡単PDF作成アプリ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:900px;margin:auto;padding:22px 14px 40px}
h1{text-align:center;font-size:25px;margin:4px 0 20px}
.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 16px rgba(0,0,0,.07);margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:7px}
input,textarea,select{width:100%;border:1px solid #d5d8dd;border-radius:10px;padding:12px;font-size:16px;outline:none}
textarea{min-height:320px;resize:vertical;line-height:1.75}
.controls{display:grid;grid-template-columns:1fr 150px;gap:12px;margin-bottom:14px}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;cursor:pointer}
.primary{background:#222;color:#fff}
.secondary{background:#e9eaec;color:#222}
.hint{font-size:13px;color:#777;margin-top:8px}
.preview-wrap{overflow:auto;background:#e7e8ea;border-radius:12px;padding:20px}
.page{background:#fff;width:794px;min-height:1123px;margin:auto;padding:72px 68px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow-wrap:anywhere}
.page h2{font-size:27px;line-height:1.4;margin:0 0 28px}
.page .body{font-size:16px;line-height:1.9;white-space:pre-wrap}
@media(max-width:650px){.controls{grid-template-columns:1fr}.preview-wrap{padding:8px}}
@media print{
 @page{size:A4 portrait;margin:0}
 body{background:#fff}
 .app{max-width:none;margin:0;padding:0}
 h1,.editor-panel{display:none!important}
 .preview-panel{display:block!important;margin:0;padding:0;box-shadow:none;border-radius:0}
 .preview-panel>label{display:none}
 .preview-wrap{padding:0;background:#fff;overflow:visible}
 .page{width:210mm;min-height:297mm;margin:0;padding:18mm;box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
<h1>📄 簡単PDF作成アプリ</h1>

<div class="panel editor-panel">
 <div class="controls">
  <div><label for="title">タイトル</label><input id="title" placeholder="例：旅行メモ"></div>
  <div><label for="fontSize">文字サイズ</label>
   <select id="fontSize">
    <option value="14">小さめ</option><option value="16" selected>標準</option>
    <option value="18">大きめ</option><option value="20">特大</option>
   </select>
  </div>
 </div>
 <label for="text">本文</label>
 <textarea id="text" placeholder="ここに文章をコピー＆貼り付けしてください。"></textarea>
 <div class="buttons">
  <button class="secondary" id="clearBtn">クリア</button>
  <button class="primary" id="previewBtn">プレビュー更新</button>
  <button class="primary" id="pdfBtn">📄 PDF作成</button>
 </div>
 <div class="hint">A4・縦向き。PDF作成では、表示中のプレビューそのものを印刷対象にします。</div>
</div>

<div class="panel preview-panel">
 <label>プレビュー</label>
 <div class="preview-wrap">
  <div class="page" id="previewPage">
   <h2 id="previewTitle">タイトル</h2>
   <div class="body" id="previewBody">本文を入力すると、ここにプレビューが表示されます。</div>
  </div>
 </div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);

function updatePreview(){
 $("previewTitle").textContent=$("title").value.trim()||"タイトル";
 $("previewBody").textContent=$("text").value||"本文を入力すると、ここにプレビューが表示されます。";
 $("previewBody").style.fontSize=$("fontSize").value+"px";
}

$("title").addEventListener("input",updatePreview);
$("text").addEventListener("input",updatePreview);
$("fontSize").addEventListener("change",updatePreview);
$("previewBtn").onclick=updatePreview;

$("clearBtn").onclick=()=>{
 if(confirm("入力内容をクリアしますか？")){
  $("title").value="";
  $("text").value="";
  updatePreview();
 }
};

$("pdfBtn").onclick=()=>{
 if(!$("text").value.trim()){
  alert("本文を入力してください。");
  $("text").focus();
  return;
 }
 updatePreview();

 // iPhone/Safariでも印刷対象DOMが確実に描画されてから印刷する
 requestAnimationFrame(()=>{
  requestAnimationFrame(()=>{
   window.print();
  });
 });
};

updatePreview();
</script>
</body>
</html>
