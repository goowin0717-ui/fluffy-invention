<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>簡単リンク</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#222}
.app{max-width:680px;margin:auto;padding:28px 16px 48px}h1{text-align:center;margin:0 0 22px;font-size:28px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.06);margin-bottom:18px}
.form{display:grid;gap:10px}input,textarea{width:100%;padding:13px 14px;border:1px solid #d8dbe0;border-radius:10px;font-size:16px;outline:none}
textarea{resize:vertical;line-height:1.5}button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;cursor:pointer}
.primary{background:#222;color:#fff}.secondary,.edit{background:#eee;color:#222}.danger{background:#ffe8e8;color:#c62828}
.toolbar{display:flex;gap:8px;margin:0 0 12px}.toolbar button{flex:1}
.links{display:grid;gap:10px}.link-row{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
.site-link{flex:1;color:#222;text-decoration:none;font-weight:600;padding:4px 0;word-break:break-word}.actions{display:flex;gap:6px}
button:disabled{opacity:.35;cursor:default}.empty{text-align:center;color:#888;padding:28px 10px}.hint{font-size:13px;color:#777;margin:8px 2px 0}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{width:min(100%,480px);background:#fff;border-radius:16px;padding:20px}.modal h2{margin:0 0 14px;font-size:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.error{color:#c62828;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="app">
<h1>🔗 簡単リンク</h1>
<div class="card">
 <div class="form">
  <input id="siteName" placeholder="サイト名（例：Google）" maxlength="100">
  <input id="siteUrl" placeholder="URL（例：https://www.google.com/）" inputmode="url">
  <div id="formError" class="error"></div>
  <button class="primary" id="addBtn">＋ 登録</button>
 </div>
 <div class="hint">登録したリンクはこのブラウザに保存されます。</div>
</div>

<div class="toolbar">
 <button class="secondary" id="importBtn">📋 一括インポート</button>
 <button class="secondary" id="sortBtn">↕ 並び替え</button>
</div>
<div class="links" id="links"></div>
</div>

<div class="modal-backdrop" id="importBackdrop">
 <div class="modal">
  <h2>📋 リンクを一括インポート</h2>
  <div class="form">
   <textarea id="importText" rows="10" placeholder="Google&#9;https://www.google.com/
Yahoo! JAPAN&#9;https://www.yahoo.co.jp/
YouTube&#9;https://www.youtube.com/"></textarea>
   <div id="importError" class="error"></div>
  </div>
  <div class="modal-actions">
   <button class="secondary" id="cancelImport">キャンセル</button>
   <button class="primary" id="runImport">読み込む</button>
  </div>
  <div class="hint">Excelから「サイト名」と「URL」の2列をコピーして、そのまま貼り付けられます。</div>
 </div>
</div>

<div class="modal-backdrop" id="editBackdrop">
 <div class="modal">
  <h2>リンクを編集</h2>
  <div class="form">
   <input id="editName" maxlength="100">
   <input id="editUrl" inputmode="url">
   <div id="editError" class="error"></div>
  </div>
  <div class="modal-actions">
   <button class="secondary" id="cancelEdit">キャンセル</button>
   <button class="primary" id="saveEdit">保存</button>
   <button class="danger" id="deleteLink">削除</button>
  </div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const KEY="kantan-link-items";
let items=JSON.parse(localStorage.getItem(KEY)||"[]");
let editingId=null,sortMode=false;
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function normalizeUrl(v){v=v.trim();return /^https?:\\/\\//i.test(v)?v:"https://"+v}
function validUrl(v){try{let u=new URL(normalizeUrl(v));return u.protocol==="http:"||u.protocol==="https:"}catch(e){return false}}

function render(){
 const root=$("links");root.innerHTML="";
 $("sortBtn").textContent=sortMode?"✓ 並び替え終了":"↕ 並び替え";
 if(!items.length){root.innerHTML='<div class="card empty">まだリンクが登録されていません。</div>';return}
 items.forEach((item,i)=>{
  const row=document.createElement("div");row.className="link-row";
  const a=document.createElement("a");a.className="site-link";a.href=item.url;a.target="_self";a.rel="noopener";a.textContent=item.name;
  const actions=document.createElement("div");actions.className="actions";
  if(sortMode){
   const up=document.createElement("button");up.className="edit";up.textContent="↑";up.disabled=i===0;
   up.onclick=()=>{if(i>0){[items[i-1],items[i]]=[items[i],items[i-1]];save();render()}};
   const down=document.createElement("button");down.className="edit";down.textContent="↓";down.disabled=i===items.length-1;
   down.onclick=()=>{if(i<items.length-1){[items[i+1],items[i]]=[items[i],items[i+1]];save();render()}};
   actions.append(up,down);
  }else{
   const edit=document.createElement("button");edit.className="edit";edit.textContent="編集";edit.onclick=()=>openEdit(item.id);actions.append(edit);
  }
  row.append(a,actions);root.append(row);
 });
}

$("addBtn").onclick=()=>{
 const name=$("siteName").value.trim(),url=$("siteUrl").value.trim();$("formError").textContent="";
 if(!name)return $("formError").textContent="サイト名を入力してください。";
 if(!validUrl(url))return $("formError").textContent="正しいURLを入力してください。";
 items.push({id:Date.now().toString()+Math.random(),name,url:normalizeUrl(url)});save();render();
 $("siteName").value="";$("siteUrl").value="";$("siteName").focus();
};

$("sortBtn").onclick=()=>{sortMode=!sortMode;render()};

function openEdit(id){
 const x=items.find(v=>v.id===id);if(!x)return;editingId=id;
 $("editName").value=x.name;$("editUrl").value=x.url;$("editError").textContent="";$("editBackdrop").style.display="flex";
}
function closeEdit(){$("editBackdrop").style.display="none";editingId=null}
$("cancelEdit").onclick=closeEdit;
$("saveEdit").onclick=()=>{
 const x=items.find(v=>v.id===editingId),name=$("editName").value.trim(),url=$("editUrl").value.trim();$("editError").textContent="";
 if(!x)return closeEdit();if(!name)return $("editError").textContent="サイト名を入力してください。";
 if(!validUrl(url))return $("editError").textContent="正しいURLを入力してください.";
 x.name=name;x.url=normalizeUrl(url);save();render();closeEdit();
};
$("deleteLink").onclick=()=>{
 if(!editingId||!confirm("このリンクを削除しますか？"))return;
 items=items.filter(v=>v.id!==editingId);save();render();closeEdit();
};
$("editBackdrop").onclick=e=>{if(e.target===$("editBackdrop"))closeEdit()};

$("importBtn").onclick=()=>{$("importText").value="";$("importError").textContent="";$("importBackdrop").style.display="flex";$("importText").focus()};
function closeImport(){$("importBackdrop").style.display="none"}
$("cancelImport").onclick=closeImport;
$("importBackdrop").onclick=e=>{if(e.target===$("importBackdrop"))closeImport()};
$("runImport").onclick=()=>{
 const text=$("importText").value.trim();$("importError").textContent="";
 if(!text)return $("importError").textContent="インポートするデータを貼り付けてください。";
 let added=0,skip=0;
 text.split(/\\r?\\n/).forEach(line=>{
  if(!line.trim())return;
  let p=line.split("\\t");if(p.length<2)p=line.trim().split(/\\s{2,}/);
  let name=(p[0]||"").trim(),url=p.slice(1).join("\\t").trim();
  if(!name||!url||!validUrl(url)){skip++;return}
  items.push({id:Date.now().toString()+Math.random(),name,url:normalizeUrl(url)});added++;
 });
 if(!added)return $("importError").textContent="読み込めるデータがありません。";
 save();render();closeImport();alert(added+"件を登録しました。"+(skip?"\\n"+skip+"行は読み込めませんでした。":""));
};
["siteName","siteUrl"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click()}));
render();
</script>
</body>
</html>
