<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株価ダッシュボード(v2)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #0f1117; color: #e0e0e0;
    min-height: 100vh; padding: 20px;
  }
  h1 { font-size: 1.4em; font-weight: 700; color: #fff; letter-spacing: 0.05em; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .badge { font-size: 0.7em; background: #1e3a5f; color: #5ba3f5; padding: 3px 8px; border-radius: 20px; }

  .apikey-bar {
    background: #1a1d27; border: 1px solid #2a2d3e;
    border-radius: 10px; padding: 14px 18px;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .apikey-bar label { font-size: 0.85em; color: #aaa; white-space: nowrap; }
  .apikey-bar input {
    flex: 1; min-width: 220px;
    background: #0f1117; border: 1px solid #3a3d50;
    color: #e0e0e0; padding: 7px 12px; border-radius: 6px; font-size: 0.9em;
  }
  .apikey-bar input:focus { outline: none; border-color: #5ba3f5; }

  .btn {
    padding: 7px 16px; border: none; border-radius: 6px;
    font-size: 0.85em; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    user-select: none;
  }
  .btn:hover { opacity: 0.82; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 0.78em; }
  .btn-danger  { background: #7f1d1d; color: #fca5a5; }
  .btn-success { background: #14532d; color: #86efac; }
  .btn-gray    { background: #2a2d3e; color: #aaa; }

  .notice {
    font-size: 0.78em; color: #888;
    background: #1a1d27; border: 1px solid #2a2d3e;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 20px;
    line-height: 1.7;
  }
  .notice a { color: #5ba3f5; }

  /* プログレス */
  #progressBar {
    height: 3px; background: #2a2d3e; border-radius: 2px;
    margin-bottom: 18px; overflow: hidden; display: none;
  }
  #progressFill {
    height: 100%; background: #2563eb; width: 0%;
    transition: width 0.4s ease; border-radius: 2px;
  }
  #progressMsg { font-size: 0.78em; color: #888; margin-bottom: 16px; display: none; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .card {
    background: #1a1d27; border: 1px solid #2a2d3e;
    border-radius: 12px; padding: 16px 20px;
  }
  .card-title { font-size: 0.72em; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  .card-value { font-size: 1.65em; font-weight: 700; color: #fff; }
  .card-change { font-size: 0.82em; margin-top: 4px; }
  .up   { color: #4ade80; }
  .down { color: #f87171; }
  .flat { color: #aaa; }

  .section-title { font-size: 0.9em; font-weight: 700; color: #ccc; margin-bottom: 12px; letter-spacing: 0.05em; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
  th {
    background: #1a1d27; color: #888; padding: 10px 14px; text-align: left;
    font-weight: 600; font-size: 0.78em; text-transform: uppercase;
    border-bottom: 1px solid #2a2d3e; white-space: nowrap;
  }
  td { padding: 10px 14px; border-bottom: 1px solid #1e2130; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1e2235; }
  .symbol { font-weight: 700; color: #fff; font-family: monospace; white-space: nowrap; }
  .name-cell { color: #bbb; font-size: 0.9em; }

  .add-bar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .add-bar input {
    background: #1a1d27; border: 1px solid #3a3d50;
    color: #e0e0e0; padding: 7px 12px; border-radius: 6px;
    font-size: 0.88em; width: 120px;
  }
  .add-bar input:focus { outline: none; border-color: #5ba3f5; }
  .add-bar-name { width: 130px !important; }

  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #3a3d50; border-top-color: #5ba3f5;
    border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer { margin-top: 20px; font-size: 0.75em; color: #555; text-align: right; }

  @media (max-width: 500px) {
    body { padding: 12px; }
    .card-value { font-size: 1.35em; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📈 株価ダッシュボード</h1>
  <span class="badge">Alpha Vantage</span>
</div>

<div class="notice">
  🔑 APIキーは <a href="https://www.alphavantage.co/support/#api-key" target="_blank">alphavantage.co</a> で無料取得（メール登録のみ）。<br>
  ⚠️ <b>無料枠の制限: 5リクエスト/分・25リクエスト/日</b>のため、銘柄数が多いと取得に時間がかかります（自動で待機します）。<br>
  ⚠️ 日本株は東証の前日終値（15分ディレイ相当）を表示。日経平均はEWJ ETFを円換算で表示します。
</div>

<div class="apikey-bar">
  <label>🔑 APIキー：</label>
  <input type="password" id="apiKeyInput" placeholder="取得したAPIキーを入力" />
  <button class="btn btn-primary" id="refreshBtn" onclick="saveAndRefresh()">保存して更新</button>
</div>

<div id="progressBar"><div id="progressFill"></div></div>
<div id="progressMsg"></div>

<!-- サマリーカード -->
<div class="summary-grid">
  <div class="card" id="card-nikkei">
    <div class="card-title">日経平均 (EWJ × JPY)</div>
    <div class="card-value"><span class="spinner"></span></div>
  </div>
  <div class="card" id="card-usdjpy">
    <div class="card-title">ドル円 (USD/JPY)</div>
    <div class="card-value"><span class="spinner"></span></div>
  </div>
</div>

<!-- ウォッチリスト -->
<div class="section-title">📋 ウォッチリスト</div>
<div class="table-wrap">
  <table id="stockTable">
    <thead>
      <tr>
        <th>ティッカー</th>
        <th>銘柄名</th>
        <th>現在値</th>
        <th>前日比</th>
        <th>変化率</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="stockTbody"></tbody>
  </table>
</div>

<div class="add-bar">
  <input type="text" id="newSymbol" placeholder="7203.T" maxlength="12" />
  <input type="text" id="newName"   placeholder="銘柄名（任意）" maxlength="20" class="add-bar-name" />
  <button class="btn btn-success btn-sm" onclick="addSymbol()">＋ 追加</button>
  <button class="btn btn-gray btn-sm"    onclick="saveAndRefresh()">🔄 全て更新</button>
</div>

<div class="footer" id="lastUpdated">最終更新: —</div>

<script>
// ── 初期銘柄 ──────────────────────────────────────
const DEFAULT_SYMBOLS = [
 { s: '9432.T', name: 'NTT' },
 { s: '8306.T', name: '三菱UFJ FG' },
 { s: '5020.T', name: 'ENEOS' },
 { s: '9023.T', name: '東京地下鉄' },
 { s: '1572.T', name: '中国H株ブル2倍' },
 
//オリジナルの銘柄配列
 /* { s: '7203.T', name: 'トヨタ自動車' },
  { s: '6758.T', name: 'ソニーグループ' },
  { s: '9984.T', name: 'ソフトバンクG' },
  { s: '8306.T', name: '三菱UFJ FG' },
  { s: '6501.T', name: '日立製作所' },
  { s: '6861.T', name: 'キーエンス' },
  { s: '4063.T', name: '信越化学工業' },
  { s: '9432.T', name: 'NTT' },
  { s: '8035.T', name: '東京エレクトロン' },
  { s: '6367.T', name: 'ダイキン工業' },*/
];

// ── State ─────────────────────────────────────────
let apiKey  = '';
let symbols = JSON.parse(JSON.stringify(DEFAULT_SYMBOLS));
let usdJpy  = null;   // 為替レートをキャッシュ
let running = false;

// ── Util ──────────────────────────────────────────
const delay = ms => new Promise(r => setTimeout(r, ms));
const esc   = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function setProgress(cur, total, msg) {
  const bar  = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  const txt  = document.getElementById('progressMsg');
  if (total === 0) { bar.style.display = 'none'; txt.style.display = 'none'; return; }
  bar.style.display = 'block';
  txt.style.display = 'block';
  fill.style.width  = `${Math.round(cur / total * 100)}%`;
  txt.textContent   = msg || '';
}

// ── Alpha Vantage ─────────────────────────────────
// 日本株: TIME_SERIES_DAILY → 最新終値を使用
async function fetchDaily(sym) {
  const url = `https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${encodeURIComponent(sym)}&outputsize=compact&apikey=${apiKey}`;
  const res  = await fetch(url);
  const json = await res.json();

  // レート制限チェック
  if (json['Note'] || json['Information']) {
    throw new Error('RATE_LIMIT');
  }

  const ts = json['Time Series (Daily)'];
  if (!ts) return null;

  const dates = Object.keys(ts).sort().reverse(); // 新しい順
  if (dates.length < 2) return null;

  const latest = ts[dates[0]];
  const prev   = ts[dates[1]];
  const price  = parseFloat(latest['4. close']);
  const prevP  = parseFloat(prev['4. close']);
  const change = price - prevP;
  const pct    = (change / prevP) * 100;
  return { price, change, pct };
}

// 為替
async function fetchForex(from, to) {
  const url  = `https://www.alphavantage.co/query?function=CURRENCY_EXCHANGE_RATE&from_currency=${from}&to_currency=${to}&apikey=${apiKey}`;
  const res  = await fetch(url);
  const json = await res.json();
  if (json['Note'] || json['Information']) throw new Error('RATE_LIMIT');
  const r = json['Realtime Currency Exchange Rate'];
  if (!r) return null;
  return parseFloat(r['5. Exchange Rate']);
}

// ── カード描画 ─────────────────────────────────────
function cardHtml(title, value, sub, cls) {
  return `<div class="card-title">${title}</div>
          <div class="card-value">${value}</div>
          <div class="card-change ${cls || 'flat'}">${sub}</div>`;
}
function cardLoading(title) {
  return `<div class="card-title">${title}</div>
          <div class="card-value"><span class="spinner"></span></div>`;
}
function cardError(title, msg) {
  return `<div class="card-title">${title}</div>
          <div class="card-value" style="font-size:0.8em;color:#f87171">${msg}</div>`;
}

// ── テーブル初期描画 ──────────────────────────────
function renderTable() {
  document.getElementById('stockTbody').innerHTML = symbols.map((item, i) => `
    <tr id="row-${i}">
      <td class="symbol">${esc(item.s)}</td>
      <td class="name-cell">${esc(item.name || '—')}</td>
      <td id="price-${i}"><span class="spinner"></span></td>
      <td id="change-${i}">—</td>
      <td id="pct-${i}">—</td>
      <td><button class="btn btn-danger btn-sm" onclick="removeSymbol(${i})">削除</button></td>
    </tr>
  `).join('');
}

function setRowData(i, d) {
  if (!d) {
    document.getElementById(`price-${i}`).textContent  = 'N/A';
    document.getElementById(`change-${i}`).textContent = '—';
    document.getElementById(`pct-${i}`).textContent    = '—';
    return;
  }
  const sym  = symbols[i].s;
  const isJP = sym.endsWith('.T');
  const sign = d.change >= 0 ? '+' : '';
  const cls  = d.change > 0 ? 'up' : d.change < 0 ? 'down' : 'flat';

  let priceStr;
  if (isJP) {
    priceStr = `¥${d.price.toLocaleString('ja-JP', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}`;
  } else {
    priceStr = `$${d.price.toFixed(2)}`;
  }
  document.getElementById(`price-${i}`).innerHTML  = `<span style="color:#fff;font-weight:600">${priceStr}</span>`;
  document.getElementById(`change-${i}`).innerHTML = `<span class="${cls}">${sign}${d.change.toFixed(1)}</span>`;
  document.getElementById(`pct-${i}`).innerHTML    = `<span class="${cls}">${sign}${d.pct.toFixed(2)}%</span>`;
}

function setRowError(i, msg) {
  document.getElementById(`price-${i}`).innerHTML = `<span style="color:#f87171;font-size:0.85em">${msg}</span>`;
  document.getElementById(`change-${i}`).textContent = '—';
  document.getElementById(`pct-${i}`).textContent    = '—';
}

// ── レート制限を考慮した順次取得 ─────────────────
// 無料: 5req/min → 1リクエストごとに13秒待機
const INTERVAL_MS = 13000;

async function fetchWithRetry(fn, label) {
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      return await fn();
    } catch (e) {
      if (e.message === 'RATE_LIMIT' && attempt < 2) {
        setProgress(0, 1, `⏳ レート制限: 60秒待機中… (${label})`);
        await delay(62000);
      } else {
        throw e;
      }
    }
  }
}

// ── メイン更新処理 ─────────────────────────────────
async function saveAndRefresh() {
  if (running) return;
  const k = document.getElementById('apiKeyInput').value.trim();
  if (!k) { alert('APIキーを入力してください。'); return; }
  apiKey  = k;
  running = true;
  document.getElementById('refreshBtn').disabled = true;

  renderTable();
  document.getElementById('card-nikkei').innerHTML  = cardLoading('日経平均 (EWJ × JPY)');
  document.getElementById('card-usdjpy').innerHTML  = cardLoading('ドル円 (USD/JPY)');

  const total = 2 + symbols.length; // USDJPY + EWJ + 銘柄
  let done = 0;

  // ① USD/JPY
  setProgress(done, total, '取得中: USD/JPY…');
  try {
    usdJpy = await fetchWithRetry(() => fetchForex('USD', 'JPY'), 'USD/JPY');
    const r = usdJpy;
    document.getElementById('card-usdjpy').innerHTML =
      cardHtml('ドル円 (USD/JPY)', `¥${r.toFixed(2)}`, 'リアルタイム為替レート', 'flat');
  } catch(e) {
    document.getElementById('card-usdjpy').innerHTML = cardError('ドル円 (USD/JPY)', 'エラー');
    usdJpy = null;
  }
  done++;
  setProgress(done, total, '');
  await delay(INTERVAL_MS);

  // ② EWJ（日経平均代替）→ USD→JPY換算
  setProgress(done, total, '取得中: EWJ (日経平均)…');
  try {
    const d = await fetchWithRetry(() => fetchDaily('EWJ'), 'EWJ');
    if (d && usdJpy) {
      const priceJpy  = d.price  * usdJpy;
      const changeJpy = d.change * usdJpy;
      const sign = changeJpy >= 0 ? '+' : '';
      const cls  = changeJpy > 0 ? 'up' : changeJpy < 0 ? 'down' : 'flat';
      document.getElementById('card-nikkei').innerHTML =
        cardHtml('日経平均 (EWJ × JPY)',
          `¥${Math.round(priceJpy).toLocaleString('ja-JP')}`,
          `${sign}¥${Math.round(changeJpy).toLocaleString('ja-JP')} (${sign}${d.pct.toFixed(2)}%)`, cls);
    } else {
      document.getElementById('card-nikkei').innerHTML = cardError('日経平均 (EWJ × JPY)', 'データ取得失敗');
    }
  } catch(e) {
    document.getElementById('card-nikkei').innerHTML = cardError('日経平均 (EWJ × JPY)', 'エラー');
  }
  done++;
  setProgress(done, total, '');
  await delay(INTERVAL_MS);

  // ③ 個別銘柄（TIME_SERIES_DAILY）
  for (let i = 0; i < symbols.length; i++) {
    const sym = symbols[i].s;
    setProgress(done, total, `取得中: ${sym} (${i + 1}/${symbols.length})…`);
    try {
      const d = await fetchWithRetry(() => fetchDaily(sym), sym);
      setRowData(i, d);
    } catch(e) {
      setRowError(i, 'エラー');
    }
    done++;
    setProgress(done, total, '');
    if (i < symbols.length - 1) await delay(INTERVAL_MS);
  }

  setProgress(0, 0, '');
  document.getElementById('lastUpdated').textContent =
    '最終更新: ' + new Date().toLocaleString('ja-JP');
  document.getElementById('refreshBtn').disabled = false;
  running = false;
}

// ── 追加・削除 ────────────────────────────────────
function addSymbol() {
  const sInp = document.getElementById('newSymbol');
  const nInp = document.getElementById('newName');
  const s = sInp.value.trim().toUpperCase();
  if (!s) return;
  if (symbols.find(x => x.s === s)) { alert('すでに追加されています。'); return; }
  symbols.push({ s, name: nInp.value.trim() });
  sInp.value = ''; nInp.value = '';
  renderTable();
}

function removeSymbol(i) {
  symbols.splice(i, 1);
  renderTable();
}

// ── 初期描画 ──────────────────────────────────────
renderTable();
document.getElementById('card-nikkei').innerHTML  =
  cardHtml('日経平均 (EWJ × JPY)', '—', 'APIキーを入力して更新', 'flat');
document.getElementById('card-usdjpy').innerHTML  =
  cardHtml('ドル円 (USD/JPY)',      '—', 'APIキーを入力して更新', 'flat');
</script>
</body>
</html>
