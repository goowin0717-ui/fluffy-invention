<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電卓アプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
        }

        .calculator {
            width: 340px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            overflow: hidden;
        }

        .expression {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            min-height: 24px;
            word-break: break-all;
            text-align: right;
            width: 100%;
            margin-bottom: 8px;
        }

        .result {
            color: #ffffff;
            font-size: 42px;
            font-weight: 300;
            text-align: right;
            width: 100%;
            line-height: 1.2;
            transition: font-size 0.2s ease;
        }

        .result.small {
            font-size: 28px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 64px;
            border: none;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            transition: opacity 0.15s ease;
            border-radius: 16px;
        }

        button:active::after {
            opacity: 0.15;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-number {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .btn-number:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .btn-operator {
            background: rgba(83, 120, 255, 0.3);
            color: #7a9fff;
        }

        .btn-operator:hover {
            background: rgba(83, 120, 255, 0.45);
        }

        .btn-function {
            background: rgba(255, 100, 100, 0.2);
            color: #ff8a8a;
        }

        .btn-function:hover {
            background: rgba(255, 100, 100, 0.3);
        }

        .btn-equals {
            background: linear-gradient(135deg, #5378ff, #7a5cff);
            color: #ffffff;
            grid-column: span 1;
        }

        .btn-equals:hover {
            background: linear-gradient(135deg, #6a8aff, #8e7aff);
        }

        .btn-zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
            <button class="btn-function" onclick="clearAll()">AC</button>
            <button class="btn-function" onclick="clearEntry()">CE</button>
            <button class="btn-operator" onclick="inputPercent()">%</button>
            <button class="btn-operator" onclick="inputOperator('/')">÷</button>

            <button class="btn-number" onclick="inputDigit('7')">7</button>
            <button class="btn-number" onclick="inputDigit('8')">8</button>
            <button class="btn-number" onclick="inputDigit('9')">9</button>
            <button class="btn-operator" onclick="inputOperator('*')">×</button>

            <button class="btn-number" onclick="inputDigit('4')">4</button>
            <button class="btn-number" onclick="inputDigit('5')">5</button>
            <button class="btn-number" onclick="inputDigit('6')">6</button>
            <button class="btn-operator" onclick="inputOperator('-')">−</button>

            <button class="btn-number" onclick="inputDigit('1')">1</button>
            <button class="btn-number" onclick="inputDigit('2')">2</button>
            <button class="btn-number" onclick="inputDigit('3')">3</button>
            <button class="btn-operator" onclick="inputOperator('+')">+</button>

            <button class="btn-number btn-zero" onclick="inputDigit('0')">0</button>
            <button class="btn-number" onclick="inputDecimal()">.</button>
            <button class="btn-equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetScreen = false;
        let expressionText = '';

        const resultDisplay = document.getElementById('result');
        const expressionDisplay = document.getElementById('expression');

        function updateDisplay() {
            resultDisplay.textContent = currentInput;
            expressionDisplay.textContent = expressionText;
            if (currentInput.length > 10) {
                resultDisplay.classList.add('small');
            } else {
                resultDisplay.classList.remove('small');
            }
        }

        function inputDigit(digit) {
            if (shouldResetScreen) {
                currentInput = digit;
                shouldResetScreen = false;
            } else {
                if (currentInput === '0') {
                    currentInput = digit;
                } else {
                    if (currentInput.length >= 15) return;
                    currentInput += digit;
                }
            }
            updateDisplay();
        }

        function inputDecimal() {
            if (shouldResetScreen) {
                currentInput = '0.';
                shouldResetScreen = false;
                updateDisplay();
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        function inputOperator(op) {
            if (operator && !shouldResetScreen) {
                calculate();
            }
            previousInput = currentInput;
            operator = op;
            shouldResetScreen = true;
            const opSymbol = getOperatorSymbol(op);
            expressionText = formatNumber(previousInput) + ' ' + opSymbol;
            updateDisplay();
        }

        function inputPercent() {
            if (currentInput === '0') return;
            let value = parseFloat(currentInput);
            if (operator && previousInput) {
                value = parseFloat(previousInput) * (value / 100);
            } else {
                value = value / 100;
            }
            currentInput = parseFloat(value.toPrecision(12)).toString();
            updateDisplay();
        }

        function calculate() {
            if (!operator || !previousInput) return;
            const prev = parseFloat(previousInput);
            const curr = parseFloat(currentInput);
            let result;

            const opSymbol = getOperatorSymbol(operator);
            expressionText = formatNumber(previousInput) + ' ' + opSymbol + ' ' + formatNumber(currentInput) + ' =';

            switch (operator) {
                case '+': result = prev + curr; break;
                case '-': result = prev - curr; break;
                case '*': result = prev * curr; break;
                case '/': result = curr === 0 ? 'エラー' : prev / curr; break;
            }

            if (typeof result === 'number') {
                result = parseFloat(result.toPrecision(12));
            }

            currentInput = result.toString();
            operator = null;
            previousInput = '';
            shouldResetScreen = true;
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetScreen = false;
            expressionText = '';
            updateDisplay();
        }

        function clearEntry() {
            currentInput = '0';
            updateDisplay();
        }

        function getOperatorSymbol(op) {
            switch (op) {
                case '+': return '+';
                case '-': return '−';
                case '*': return '×';
                case '/': return '÷';
                default: return op;
            }
        }

        function formatNumber(numStr) {
            const num = parseFloat(numStr);
            if (isNaN(num)) return numStr;
            if (numStr.endsWith('.')) return numStr;
            return numStr;
        }

        document.addEventListener('keydown', function(e) {
            if (e.key >= '0' && e.key <= '9') {
                inputDigit(e.key);
            } else if (e.key === '.') {
                inputDecimal();
            } else if (e.key === '+') {
                inputOperator('+');
            } else if (e.key === '-') {
                inputOperator('-');
            } else if (e.key === '*') {
                inputOperator('*');
            } else if (e.key === '/') {
                e.preventDefault();
                inputOperator('/');
            } else if (e.key === 'Enter' || e.key === '=') {
                calculate();
            } else if (e.key === 'Escape') {
                clearAll();
            } else if (e.key === 'Backspace') {
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = '0';
                }
                updateDisplay();
            } else if (e.key === '%') {
                inputPercent();
            }
        });

        updateDisplay();
    </script>
</body>
</html>
