<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡単リンク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f5;
    --bg-deep:#dbe5ea;
    --surface:#fbfdff;
    --surface-2:#f3f8fb;
    --ink:#12202a;
    --muted:#63717c;
    --faint:#8997a2;
    --accent:#0f8f82;
    --accent-strong:#087366;
    --accent-weak:color-mix(in oklab, var(--accent) 12%, var(--surface));
    --warn:#c24949;
    --warn-weak:color-mix(in oklab, var(--warn) 10%, var(--surface));
    --line:color-mix(in oklab, var(--ink) 12%, transparent);
    --line-strong:color-mix(in oklab, var(--ink) 20%, transparent);
    --shadow:0 1px 2px rgba(18,32,42,.05),0 24px 58px -30px rgba(18,32,42,.38);
    --shadow-soft:0 1px 2px rgba(18,32,42,.04),0 18px 40px -32px rgba(18,32,42,.32);
    --radius:22px;
    --radius-sm:14px;
    --step--1:clamp(.82rem,.78rem + .15vw,.9rem);
    --step-0:clamp(.95rem,.9rem + .25vw,1.05rem);
    --step-1:clamp(1.12rem,1rem + .55vw,1.34rem);
    --step-2:clamp(1.42rem,1.18rem + 1.1vw,2.05rem);
    --step-3:clamp(2.15rem,1.48rem + 3.15vw,3.85rem);
    --space:clamp(1rem,.75rem + 1.1vw,1.6rem);
  }
  *{box-sizing:border-box}
  html{min-height:100%}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(15,143,130,.16), transparent 28rem),
      radial-gradient(circle at 85% 0%, rgba(255,255,255,.9), transparent 20rem),
      linear-gradient(135deg,var(--bg),var(--bg-deep));
    color:var(--ink);
    font-family:"Outfit","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
    line-height:1.85;
    overflow-wrap:anywhere;
  }
  button,input{font:inherit}
  button{cursor:pointer}
  .app-shell{
    width:min(1120px,calc(100% - 28px));
    margin:0 auto;
    padding:clamp(22px,4vw,54px) 0;
  }
  .hero{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:clamp(18px,3.2vw,38px);
    align-items:end;
    margin-bottom:clamp(18px,3vw,34px);
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }
  .mark{
    width:44px;height:44px;border-radius:15px;
    background:
      linear-gradient(135deg,rgba(255,255,255,.8),transparent 48%),
      linear-gradient(135deg,var(--accent),#0c5d92);
    box-shadow:0 12px 28px -18px var(--accent-strong);
    position:relative;
  }
  .mark::before,.mark::after{
    content:"";position:absolute;border:2px solid rgba(255,255,255,.82);border-radius:999px;
    width:15px;height:8px;top:17px;
  }
  .mark::before{left:9px;transform:rotate(-28deg)}
  .mark::after{right:9px;transform:rotate(-28deg)}
  .mark span{position:absolute;left:18px;top:20px;width:8px;height:2px;background:rgba(255,255,255,.9);border-radius:99px;transform:rotate(-28deg)}
  .eyebrow{
    margin:0;
    color:var(--accent-strong);
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:var(--step--1);
  }
  h1{
    margin:0;
    font-size:var(--step-3);
    line-height:1.03;
    letter-spacing:-.055em;
    font-weight:800;
    font-feature-settings:"palt";
  }
  .lead{
    margin:16px 0 0;
    color:var(--muted);
    max-width:56ch;
    font-size:var(--step-0);
  }
  .status-card{
    background:rgba(251,253,255,.74);
    border:1px solid rgba(255,255,255,.72);
    border-radius:var(--radius);
    box-shadow:var(--shadow-soft);
    padding:18px;
    backdrop-filter:blur(16px);
  }
  .status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .status-item{
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 12px;
    background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(243,248,251,.88));
  }
  .status-item b{display:block;font-size:1.45rem;line-height:1.1;letter-spacing:-.03em}
  .status-item span{display:block;color:var(--muted);font-size:.78rem;margin-top:5px}

  .layout{
    display:grid;
    grid-template-columns:minmax(280px,390px) 1fr;
    gap:clamp(16px,2.4vw,28px);
    align-items:start;
  }
  .panel{
    background:rgba(251,253,255,.86);
    border:1px solid rgba(255,255,255,.8);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
  }
  .form-panel{padding:22px;position:sticky;top:18px}
  .panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  h2{font-size:var(--step-1);line-height:1.25;margin:0;letter-spacing:-.025em;font-feature-settings:"palt"}
  .mode-pill{
    border:1px solid var(--line);
    color:var(--accent-strong);
    background:var(--accent-weak);
    border-radius:999px;
    padding:4px 10px;
    font-size:.76rem;
    font-weight:800;
    white-space:nowrap;
  }
  .field{margin:0 0 14px}
  label{display:block;color:var(--muted);font-size:.82rem;font-weight:700;margin:0 0 7px}
  input[type="text"],input[type="url"]{
    width:100%;
    border:1px solid var(--line-strong);
    border-radius:15px;
    padding:13px 14px;
    color:var(--ink);
    background:rgba(255,255,255,.9);
    outline:none;
    transition:border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px color-mix(in oklab, var(--accent) 16%, transparent);
    background:#fff;
  }
  .actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}
  .btn{
    border:0;
    border-radius:15px;
    min-height:48px;
    padding:0 16px;
    font-weight:800;
    letter-spacing:.01em;
    transition:transform .12s ease, filter .16s ease, box-shadow .16s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.link-card a:focus-visible,.icon-btn:focus-visible{outline:3px solid color-mix(in oklab, var(--accent) 55%, transparent);outline-offset:3px}
  .primary{background:linear-gradient(135deg,var(--accent),#0b7a9f);color:white;box-shadow:0 16px 28px -18px var(--accent-strong)}
  .primary:hover{filter:brightness(1.04);box-shadow:0 20px 34px -20px var(--accent-strong)}
  .ghost{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
  .ghost:hover{filter:brightness(.98)}
  .danger{background:var(--warn-weak);color:var(--warn);border:1px solid color-mix(in oklab, var(--warn) 24%, transparent)}
  .danger:hover{filter:brightness(.98)}
  .hint-box{
    margin-top:16px;
    padding:13px 14px;
    border-radius:15px;
    background:color-mix(in oklab, var(--accent) 8%, var(--surface));
    color:var(--muted);
    font-size:var(--step--1);
  }
  .message{
    min-height:1.6em;
    margin:12px 0 0;
    color:var(--accent-strong);
    font-weight:700;
    font-size:.86rem;
  }
  .message.error{color:var(--warn)}

  .list-panel{padding:18px;min-height:390px}
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:4px 4px 18px;
    border-bottom:1px solid var(--line);
  }
  .toolbar p{margin:4px 0 0;color:var(--muted);font-size:var(--step--1)}
  .search-wrap{width:min(270px,45%)}
  .search-wrap input{padding:11px 13px;border-radius:14px}
  .links{
    list-style:none;
    margin:0;
    padding:18px 0 0;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .link-card{
    position:relative;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
    padding:14px;
    border:1px solid var(--line);
    border-radius:18px;
    background:
      linear-gradient(90deg,color-mix(in oklab, var(--accent) 8%, transparent),transparent 45%),
      rgba(255,255,255,.82);
    min-height:74px;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .link-card:hover{transform:translateY(-2px);box-shadow:0 18px 28px -26px rgba(18,32,42,.5);border-color:color-mix(in oklab, var(--accent) 28%, transparent)}
  .link-main{min-width:0}
  .link-card a{
    color:var(--ink);
    text-decoration:none;
    font-weight:800;
    font-size:var(--step-0);
    line-height:1.35;
    letter-spacing:-.015em;
    display:inline-flex;
    align-items:center;
    gap:9px;
  }
  .link-card a::before{
    content:"";
    width:9px;height:9px;border-radius:999px;
    background:var(--accent);
    box-shadow:0 0 0 5px color-mix(in oklab, var(--accent) 13%, transparent);
    flex:0 0 auto;
  }
  .link-meta{display:block;color:var(--faint);font-size:.75rem;margin-top:5px;font-weight:700}
  .icon-btn{
    border:1px solid var(--line);
    background:rgba(243,248,251,.95);
    color:var(--muted);
    border-radius:13px;
    min-width:48px;
    min-height:42px;
    padding:0 10px;
    font-weight:800;
  }
  .icon-btn:hover{color:var(--accent-strong);background:var(--accent-weak)}
  .empty{
    display:grid;
    place-items:center;
    min-height:280px;
    color:var(--muted);
    text-align:center;
    padding:36px 18px;
  }
  .empty-mark{
    width:70px;height:70px;border-radius:24px;margin:0 auto 14px;
    background:
      repeating-linear-gradient(135deg,color-mix(in oklab,var(--accent) 16%,transparent) 0 8px,transparent 8px 16px),
      var(--surface-2);
    border:1px dashed color-mix(in oklab,var(--accent) 42%,transparent);
  }
  .empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

  dialog{
    width:min(430px,calc(100% - 28px));
    border:0;
    border-radius:24px;
    padding:0;
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 26px 80px -24px rgba(18,32,42,.55);
  }
  dialog::backdrop{background:rgba(18,32,42,.46);backdrop-filter:blur(4px)}
  .dialog-inner{padding:22px}
  .dialog-head{display:flex;align-items:start;justify-content:space-between;gap:14px;margin-bottom:18px}
  .dialog-head p{margin:5px 0 0;color:var(--muted);font-size:var(--step--1)}
  .dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .dialog-actions .danger{grid-column:1 / -1}
  .close-x{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;width:42px;height:42px;color:var(--muted);font-weight:900}

  @media (max-width:830px){
    .hero{grid-template-columns:1fr}
    .layout{grid-template-columns:1fr}
    .form-panel{position:static}
  }
  @media (max-width:620px){
    body{line-height:1.8}
    .app-shell{width:min(100% - 18px,1120px);padding:18px 0}
    .status-grid{grid-template-columns:1fr 1fr}
    .status-item:last-child{grid-column:1 / -1}
    .toolbar{display:block}
    .search-wrap{width:100%;margin-top:12px}
    .links{grid-template-columns:1fr}
    .actions{grid-template-columns:1fr}
    .dialog-actions{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
  }
  @media print{
    body{background:#fff}
    .form-panel,.search-wrap,.icon-btn,.hint-box,.message,.no-print{display:none!important}
    .layout,.hero{display:block}
    .panel{box-shadow:none;border:1px solid #ddd;background:#fff}
    .links{grid-template-columns:1fr}
    .link-card{break-inside:avoid;box-shadow:none}
  }
  @page{size:A4;margin:18mm}
</style>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <div class="brand-row" aria-hidden="true">
          <div class="mark"><span></span></div>
          <p class="eyebrow">Simple link board</p>
        </div>
        <h1>簡単リンク</h1>
        <p class="lead">よく使うサイト名だけを並べるリンク集です。URLは一覧に表示せず、サイト名をタップすると新しいタブで開きます。</p>
      </div>
      <aside class="status-card" aria-label="登録状況">
        <div class="status-grid">
          <div class="status-item"><b id="countAll">0</b><span>登録済み</span></div>
          <div class="status-item"><b id="countShown">0</b><span>表示中</span></div>
          <div class="status-item"><b id="countToday">0</b><span>今回追加</span></div>
        </div>
      </aside>
    </header>

    <main class="layout">
      <section class="panel form-panel" aria-labelledby="registerTitle">
        <div class="panel-title">
          <h2 id="registerTitle">リンクを登録</h2>
          <span class="mode-pill" id="formMode">登録モード</span>
        </div>
        <form id="addForm" autocomplete="off">
          <p class="field">
            <label for="siteName">サイト名</label>
            <input id="siteName" type="text" placeholder="例：Sakana Chat" required maxlength="60">
          </p>
          <p class="field">
            <label for="siteUrl">URL</label>
            <input id="siteUrl" type="url" placeholder="例：https://example.com" required inputmode="url">
          </p>
          <div class="actions">
            <button class="btn primary" type="submit" id="submitBtn">登録する</button>
            <button class="btn ghost" type="button" id="resetBtn">クリア</button>
          </div>
          <p class="message" id="message" role="status" aria-live="polite"></p>
        </form>
        <div class="hint-box">
          URLに <strong>https://</strong> がない場合は自動で補います。登録内容はこのブラウザに保存されます。
        </div>
      </section>

      <section class="panel list-panel" aria-labelledby="listTitle">
        <div class="toolbar">
          <div>
            <h2 id="listTitle">リンク集</h2>
            <p>サイト名をタップすると移動します。URLは一覧には出しません。</p>
          </div>
          <div class="search-wrap no-print">
            <label for="searchInput" class="visually-hidden">検索</label>
            <input id="searchInput" type="text" placeholder="サイト名で検索">
          </div>
        </div>
        <ul class="links" id="linkList" aria-live="polite"></ul>
        <div class="empty" id="emptyState" hidden>
          <div>
            <div class="empty-mark" aria-hidden="true"></div>
            <strong>まだリンクがありません</strong>
            <span>左のフォームからサイト名とURLを登録してください。</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="editDialog" aria-labelledby="editTitle">
    <form method="dialog" class="dialog-inner" id="editForm">
      <div class="dialog-head">
        <div>
          <h2 id="editTitle">リンクを編集</h2>
          <p>サイト名の修正、URLの変更、削除ができます。</p>
        </div>
        <button class="close-x" value="cancel" aria-label="閉じる">×</button>
      </div>
      <p class="field">
        <label for="editName">サイト名</label>
        <input id="editName" type="text" required maxlength="60">
      </p>
      <p class="field">
        <label for="editUrl">URL</label>
        <input id="editUrl" type="url" required inputmode="url">
      </p>
      <div class="dialog-actions">
        <button class="btn primary" value="save" id="saveEditBtn">修正する</button>
        <button class="btn ghost" value="cancel">キャンセル</button>
        <button class="btn danger" type="button" id="deleteBtn">このリンクを削除</button>
      </div>
    </form>
  </dialog>

<script>
(() => {
  const STORAGE_KEY = 'kantan-link-items-v1';
  const sessionKey = 'kantan-link-session-added';
  const linkList = document.getElementById('linkList');
  const emptyState = document.getElementById('emptyState');
  const addForm = document.getElementById('addForm');
  const siteName = document.getElementById('siteName');
  const siteUrl = document.getElementById('siteUrl');
  const resetBtn = document.getElementById('resetBtn');
  const message = document.getElementById('message');
  const searchInput = document.getElementById('searchInput');
  const countAll = document.getElementById('countAll');
  const countShown = document.getElementById('countShown');
  const countToday = document.getElementById('countToday');
  const dialog = document.getElementById('editDialog');
  const editForm = document.getElementById('editForm');
  const editName = document.getElementById('editName');
  const editUrl = document.getElementById('editUrl');
  const deleteBtn = document.getElementById('deleteBtn');

  let links = load();
  let editingId = null;
  let addedThisSession = Number(sessionStorage.getItem(sessionKey) || 0);

  function load(){
    try{
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(parsed) ? parsed : [];
    }catch(_){ return []; }
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
  }

  function normalizeUrl(value){
    const raw = value.trim();
    if(!raw) return '';
    return /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
  }

  function validUrl(value){
    try{
      const url = new URL(value);
      return url.protocol === 'http:' || url.protocol === 'https:';
    }catch(_){ return false; }
  }

  function setMessage(text, isError=false){
    message.textContent = text;
    message.classList.toggle('error', isError);
    if(text){
      window.clearTimeout(setMessage.timer);
      setMessage.timer = window.setTimeout(() => { message.textContent=''; message.classList.remove('error'); }, 2800);
    }
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function render(){
    const q = searchInput.value.trim().toLowerCase();
    const shown = links.filter(item => item.name.toLowerCase().includes(q));

    countAll.textContent = String(links.length);
    countShown.textContent = String(shown.length);
    countToday.textContent = String(addedThisSession);

    linkList.innerHTML = '';
    emptyState.hidden = shown.length !== 0;
    linkList.hidden = shown.length === 0;

    shown.forEach(item => {
      const li = document.createElement('li');
      li.className = 'link-card';
      li.innerHTML = `
        <div class="link-main">
          <a href="${escapeHtml(item.url)}" target="_self" rel="noopener noreferrer">${escapeHtml(item.name)}</a>
          <span class="link-meta">タップでジャンプ</span>
        </div>
        <button class="icon-btn" type="button" data-edit="${item.id}" aria-label="${escapeHtml(item.name)}を編集">編集</button>
      `;
      linkList.appendChild(li);
    });
  }

  addForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = siteName.value.trim();
    const url = normalizeUrl(siteUrl.value);

    if(!name){ setMessage('サイト名を入力してください。', true); return; }
    if(!validUrl(url)){ setMessage('URLを確認してください。例：https://example.com', true); return; }

    const sameName = links.some(item => item.name.toLowerCase() === name.toLowerCase());
    if(sameName && !confirm('同じサイト名がすでにあります。登録しますか？')) return;

    links.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), name, url, createdAt: new Date().toISOString() });
    save();
    addedThisSession += 1;
    sessionStorage.setItem(sessionKey, String(addedThisSession));
    addForm.reset();
    siteName.focus();
    setMessage('登録しました。');
    render();
  });

  resetBtn.addEventListener('click', () => {
    addForm.reset();
    siteName.focus();
    setMessage('入力欄をクリアしました。');
  });

  searchInput.addEventListener('input', render);

  linkList.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-edit]');
    if(!btn) return;
    const item = links.find(x => x.id === btn.dataset.edit);
    if(!item) return;
    editingId = item.id;
    editName.value = item.name;
    editUrl.value = item.url;
    if(typeof dialog.showModal === 'function') dialog.showModal();
    else alert('このブラウザでは編集ダイアログを開けません。新しいブラウザでお試しください。');
  });

  editForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const submitter = e.submitter;
    if(!submitter || submitter.value !== 'save') return;

    const item = links.find(x => x.id === editingId);
    if(!item) return;

    const nextName = editName.value.trim();
    const nextUrl = normalizeUrl(editUrl.value);
    if(!nextName){ editName.focus(); return; }
    if(!validUrl(nextUrl)){ editUrl.focus(); return; }

    item.name = nextName;
    item.url = nextUrl;
    item.updatedAt = new Date().toISOString();
    save();
    render();
    dialog.close();
    setMessage('リンクを修正しました。');
  });

  deleteBtn.addEventListener('click', () => {
    const item = links.find(x => x.id === editingId);
    if(!item) return;
    if(!confirm('「' + item.name + '」を削除しますか？')) return;
    links = links.filter(x => x.id !== editingId);
    editingId = null;
    save();
    render();
    dialog.close();
    setMessage('リンクを削除しました。');
  });

  render();
})();
</script>
</body>
</html>
