<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易照度計（インカメラ対応）</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/700.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --gauge-bg: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border-radius: 24px;
            padding: 28px 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); }
        
        .gauge-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto;
        }

        .gauge-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .gauge-track { fill: none; stroke: var(--gauge-bg); stroke-width: 12; }
        .gauge-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 565.48; /* 2*PI*90 */
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s ease;
        }

        .center-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
        }

        .lux-value { font-size: 46px; font-weight: 700; line-height: 1; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
        .lux-unit { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; letter-spacing: 1px; }
        .status-text { 
            font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 20px; 
            background: rgba(255,255,255,0.05); display: inline-block;
            border: 1px solid transparent;
        }

        .controls { display: flex; flex-direction: column; gap: 10px; }
        .control-row { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-stop { background: var(--danger); color: #fff; box-shadow: 0 4px 12px rgba(239,68,68,0.3); }
        .btn-stop:hover { background: #dc2626; }
        .btn-switch { background: var(--border); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .btn-switch:hover { background: #475569; }
        
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: wait; }

        .info-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            font-size: 11px;
            color: var(--text-sub);
            line-height: 1.5;
            text-align: left;
            margin-top: auto;
        }
        .info-box strong { color: #e2e8f0; display: block; margin-bottom: 4px; font-size: 12px; }
        .info-box ul { padding-left: 18px; margin: 4px 0; }
        .info-box li { margin-bottom: 2px; }

        video, canvas { display: none; }

        @media (max-width: 400px) {
            .container { padding: 20px 16px; }
            .gauge-wrapper { width: 190px; height: 190px; }
            .lux-value { font-size: 38px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💡 簡易照度計</h1>

        <div class="gauge-wrapper">
            <svg class="gauge-svg" viewBox="0 0 200 200">
                <defs>
                    <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6"/>
                        <stop offset="100%" stop-color="#10b981"/>
                    </linearGradient>
                </defs>
                <circle class="gauge-track" cx="100" cy="100" r="90"></circle>
                <circle class="gauge-progress" id="gaugeProgress" cx="100" cy="100" r="90"></circle>
            </svg>
            <div class="center-display">
                <div class="lux-value" id="luxValue">--</div>
                <div class="lux-unit">相対 lux</div>
                <div class="status-text" id="statusText">待機中</div>
            </div>
        </div>

        <div class="controls">
            <!-- Start Buttons -->
            <div class="control-row" id="startControls">
                <button class="btn btn-primary" id="btnBack">📷 背面カメラ</button>
                <button class="btn btn-primary" id="btnFront">📸 インカメラ</button>
            </div>
            
            <!-- Active Buttons -->
            <div class="control-row hidden" id="activeControls">
                <button class="btn btn-switch" id="btnSwitch">🔄 カメラ切替</button>
                <button class="btn btn-stop" id="btnStop">⏹ 停止</button>
            </div>
        </div>

        <div class="info-box">
            <strong>📝 利用ガイド</strong>
            <ul>
                <li><strong>インカメラ:</strong> 机に置いた画面の輝度を計測。手元の明るさ比較に。</li>
                <li><strong>背面カメラ:</strong> 外部の光を向けて計測。窓際の明るさ比較に。</li>
                <li>精度は保証されませんが、相対的な「暗い・明るい」の判定に便利です。</li>
            </ul>
        </div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        // State
        let videoStream = null;
        let animFrameId = null;
        let smoothLux = 0;
        let isRunning = false;
        let currentFacingMode = 'environment'; // 'user' or 'environment'

        // DOM Elements
        const els = {
            lux: document.getElementById('luxValue'),
            status: document.getElementById('statusText'),
            gauge: document.getElementById('gaugeProgress'),
            startControls: document.getElementById('startControls'),
            activeControls: document.getElementById('activeControls'),
            btnFront: document.getElementById('btnFront'),
            btnBack: document.getElementById('btnBack'),
            btnSwitch: document.getElementById('btnSwitch'),
            btnStop: document.getElementById('btnStop'),
            video: document.getElementById('video'),
            canvas: document.getElementById('canvas')
        };

        const ctx = els.canvas.getContext('2d', { willReadFrequently: true });
        const circumference = 2 * Math.PI * 90;

        // UI Update
        function updateGauge(lux) {
            // Exponential smoothing
            smoothLux = smoothLux * 0.85 + lux * 0.15;
            const displayLux = Math.round(smoothLux);
            els.lux.textContent = displayLux;

            // Gauge progress (0-1000 maps to 0-100%)
            const progress = Math.min(displayLux / 1000, 1);
            els.gauge.style.strokeDashoffset = circumference * (1 - progress);

            // Color & Status
            let color, label;
            if (displayLux < 50) {
                color = '#64748b'; label = '🌙 暗い (読書不可)';
            } else if (displayLux < 300) {
                color = '#3b82f6'; label = '🌅 薄暗い';
            } else if (displayLux < 800) {
                color = '#10b981'; label = '☀️ 普通 (作業適正)';
            } else {
                color = '#f59e0b'; label = '🔆 明るい';
            }

            els.gauge.style.stroke = color;
            els.status.textContent = label;
            els.status.style.color = color;
            els.status.style.borderColor = `${color}40`;
        }

        function resetUI() {
            smoothLux = 0;
            els.lux.textContent = '--';
            els.status.textContent = '待機中';
            els.status.style.color = '';
            els.status.style.borderColor = '';
            els.gauge.style.stroke = 'var(--accent)';
            els.gauge.style.strokeDashoffset = circumference;
            
            els.startControls.classList.remove('hidden');
            els.activeControls.classList.add('hidden');
            els.btnFront.disabled = false;
            els.btnBack.disabled = false;
            isRunning = false;
        }

        function setActiveUI() {
            isRunning = true;
            els.startControls.classList.add('hidden');
            els.activeControls.classList.remove('hidden');
            els.btnFront.disabled = true;
            els.btnBack.disabled = true;
            
            const camType = currentFacingMode === 'user' ? 'インカメラ' : '背面カメラ';
            els.status.textContent = `${camType}計測中`;
        }

        // Camera Logic
        async function startCamera() {
            if (isRunning) return; // Already running

            try {
                // Stop any existing stream
                if (videoStream) {
                    videoStream.getTracks().forEach(t => t.stop());
                    videoStream = null;
                }

                els.status.textContent = 'カメラ起動中...';
                
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 320 }, height: { ideal: 240 } }
                });
                els.video.srcObject = videoStream;
                await els.video.play();
                
                els.canvas.width = 60;
                els.canvas.height = 60;
                
                setActiveUI();
                processFrame();
            } catch (e) {
                console.error(e);
                els.status.textContent = '⚠️ カメラ起動エラー';
                setTimeout(resetUI, 2000);
            }
        }

        function processFrame() {
            if (!isRunning) return;
            
            try {
                ctx.drawImage(els.video, 0, 0, 60, 60);
                const frame = ctx.getImageData(0, 0, 60, 60);
                let totalLum = 0;
                const len = frame.data.length;

                // Rec. 709 luminance formula
                for (let i = 0; i < len; i += 4) {
                    totalLum += (frame.data[i] * 0.2126 + frame.data[i+1] * 0.7152 + frame.data[i+2] * 0.0722);
                }
                const avgLum = totalLum / (len / 4); 
                const relLux = (avgLum / 255) * 1000; // Map 0-255 to 0-1000
                updateGauge(relLux);
            } catch (e) {
                console.warn(e);
            }
            
            animFrameId = requestAnimationFrame(processFrame);
        }

        function stopAll() {
            isRunning = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            resetUI();
        }

        function switchCamera() {
            if (!isRunning) return;
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        }

        // Event Listeners
        els.btnFront.onclick = () => {
            currentFacingMode = 'user';
            startCamera();
        };
        
        els.btnBack.onclick = () => {
            currentFacingMode = 'environment';
            startCamera();
        };

        els.btnStop.onclick = stopAll;
        els.btnSwitch.onclick = switchCamera;

        // Initial Check (optional UI state adjustment if camera is missing)
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            els.btnFront.textContent = 'カメラ非対応';
            els.btnBack.textContent = 'カメラ非対応';
            els.btnFront.disabled = true;
            els.btnBack.disabled = true;
            els.status.textContent = '⚠️ ブラウザ非対応';
        }
    </script>
</body>
</html>
