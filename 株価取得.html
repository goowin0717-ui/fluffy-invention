<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株価 & 為替ダッシュボード</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/700.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #3b82f6;
            --up-red: #ef4444;
            --down-green: #10b981;
            --neutral: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: var(--card-border);
            color: var(--text-main);
        }

        .refresh-btn.loading {
            opacity: 0.5;
            cursor: wait;
        }

        /* Market Overview */
        .market-overview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .market-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .market-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .market-card.nikkei::before { background: var(--accent-blue); }
        .market-card.usdjpy::before { background: #f59e0b; }

        .market-title {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .market-price {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .market-change {
            font-size: 14px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Stock List */
        .stocks-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--text-sub);
        }

        .stocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .stock-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .stock-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stock-name {
            font-size: 14px;
            font-weight: 700;
        }

        .stock-code {
            font-size: 11px;
            color: var(--text-sub);
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .stock-price {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stock-status {
            font-size: 12px;
            margin-top: 4px;
        }

        .up { color: var(--up-red); }
        .down { color: var(--down-green); }
        .neutral { color: var(--neutral); }

        .loading-skeleton {
            background: linear-gradient(90deg, var(--card-bg) 25%, #334155 50%, var(--card-bg) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
            color: transparent !important;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .last-updated {
            text-align: right;
            font-size: 11px;
            color: var(--neutral);
            margin-top: 32px;
        }

        .error-msg {
            color: var(--up-red);
            font-size: 12px;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .market-overview {
                grid-template-columns: 1fr;
            }
            .stocks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Market Watch</h1>
            <button class="refresh-btn" id="refreshBtn" onclick="fetchAllData()">更新 ↻</button>
        </div>

        <!-- Market Overview -->
        <div class="market-overview">
            <div class="market-card nikkei">
                <div class="market-title">🇯🇵 日経平均株価</div>
                <div class="market-price" id="nikkeiPrice">--</div>
                <div class="market-change" id="nikkeiChange">--</div>
            </div>
            <div class="market-card usdjpy">
                <div class="market-title">💵 ドル円 (USD/JPY)</div>
                <div class="market-price" id="usdjpyPrice">--</div>
                <div class="market-change" id="usdjpyChange">--</div>
            </div>
        </div>

        <!-- Stocks -->
        <div class="stocks-section">
            <h2>注目銘柄 (15分遅れ)</h2>
            <div class="stocks-grid" id="stocksGrid">
                <!-- Stocks will be rendered here -->
            </div>
        </div>

        <div class="last-updated" id="lastUpdated">更新日: --</div>
    </div>

    <script>
        // Watchlist
        const STOCKS = [
            { code: '7203.T', name: 'トヨタ自動車' },
            { code: '6758.T', name: 'ソニーグループ' },
            { code: '9432.T', name: 'NTT' },
            { code: '6861.T', name: 'キーエンス' },
            { code: '9983.T', name: 'ファーストリテイリング' },
            { code: '8306.T', name: '三菱UFJ' },
            { code: '4063.T', name: '信越化学' },
            { code: '8035.T', name: '東京エレクトロン' },
            { code: '6501.T', name: '日立製作所' },
            { code: '7974.T', name: '任天堂' }
        ];

        // Indices & Currencies
        const INDICES = [
            { id: 'nikkei', symbol: '^N225', name: '日経平均' },
            { id: 'usdjpy', symbol: 'JPY=X', name: 'ドル円' }
        ];

        // CORS Proxy
        const PROXY_URL = 'https://api.allorigins.win/get?url=';
        const API_BASE = 'https://query1.finance.yahoo.com/v8/finance/chart/';

        // DOM Elements
        const nikkeiPriceEl = document.getElementById('nikkeiPrice');
        const nikkeiChangeEl = document.getElementById('nikkeiChange');
        const usdjpyPriceEl = document.getElementById('usdjpyPrice');
        const usdjpyChangeEl = document.getElementById('usdjpyChange');
        const stocksGridEl = document.getElementById('stocksGrid');
        const lastUpdatedEl = document.getElementById('lastUpdated');
        const refreshBtnEl = document.getElementById('refreshBtn');

        // Helper: Format number
        function formatNumber(num, isPrice = false) {
            if (!num) return '--';
            const n = parseFloat(num);
            if (isPrice) return n.toLocaleString('ja-JP');
            return n.toLocaleString('ja-JP', { maximumFractionDigits: 3 });
        }

        // Helper: Format Change
        function formatChange(current, previous) {
            if (!current || !previous) return '';
            const change = current - previous;
            const changePercent = (change / previous) * 100;
            const sign = change >= 0 ? '+' : '';
            const colorClass = change >= 0 ? 'up' : 'down';
            const arrow = change >= 0 ? '▲' : '▼';
            return `<span class="${colorClass}">${arrow} ${sign}${formatNumber(change, true)} (${sign}${changePercent.toFixed(2)}%)</span>`;
        }

        // Fetch Single Data
        async function fetchSymbol(symbol) {
            const url = `${API_BASE}${symbol}?interval=1d&range=5d`;
            try {
                const response = await fetch(`${PROXY_URL}${encodeURIComponent(url)}`);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                // allorigins wraps the response in "contents"
                const jsonData = JSON.parse(data.contents);
                
                if (!jsonData.chart || !jsonData.chart.result) {
                    throw new Error('No data');
                }

                const result = jsonData.chart.result[0];
                const meta = result.meta;
                const quote = result.indicators.quote[0];

                // Current price is the last regularMarketPrice or close
                const currentPrice = meta.regularMarketPrice;
                
                // Previous close is usually available in meta
                const previousClose = meta.chartPreviousClose || meta.previousClose;
                
                return {
                    price: currentPrice,
                    previousClose: previousClose,
                    currency: meta.currency
                };
            } catch (error) {
                console.error(`Error fetching ${symbol}:`, error);
                return null;
            }
        }

        // Render Functions
        function renderLoading() {
            // Indices
            [nikkeiPriceEl, nikkeiChangeEl, usdjpyPriceEl, usdjpyChangeEl].forEach(el => {
                el.classList.add('loading-skeleton');
            });

            // Stocks
            stocksGridEl.innerHTML = Array(4).fill(0).map(() => `
                <div class="stock-card">
                    <div class="stock-header">
                        <div class="stock-name loading-skeleton" style="width:80px; height:16px;"></div>
                        <div class="stock-code loading-skeleton" style="width:40px; height:12px;"></div>
                    </div>
                    <div class="stock-price loading-skeleton" style="width:100px; height:24px; margin-bottom:8px;"></div>
                    <div class="stock-status loading-skeleton" style="width:60px; height:12px;"></div>
                </div>
            `).join('');
        }

        function renderStocks(stocksData) {
            stocksGridEl.innerHTML = '';
            
            if (!stocksData || stocksData.length === 0) {
                stocksGridEl.innerHTML = '<div class="error-msg">データの取得に失敗しました。</div>';
                return;
            }

            stocksData.forEach((item, index) => {
                const stock = STOCKS[index];
                const data = item;

                const div = document.createElement('div');
                div.className = 'stock-card';

                let priceHtml = '--';
                let changeHtml = '<span class="neutral">--</span>';

                if (data) {
                    priceHtml = data.currency === 'JPY' ? `¥${formatNumber(data.price, true)}` : formatNumber(data.price);
                    changeHtml = formatChange(data.price, data.previousClose);
                } else {
                    changeHtml = '<span class="error-msg">取得エラー</span>';
                }

                div.innerHTML = `
                    <div class="stock-header">
                        <div class="stock-name">${stock.name}</div>
                        <div class="stock-code">${stock.code.replace('.T','')}</div>
                    </div>
                    <div class="stock-price">${priceHtml}</div>
                    <div class="stock-status">${changeHtml}</div>
                `;
                stocksGridEl.appendChild(div);
            });
        }

        // Main Fetch Logic
        async function fetchAllData() {
            renderLoading();
            refreshBtnEl.classList.add('loading');
            refreshBtnEl.textContent = '取得中...';

            // Parallel fetch for all indices
            const indicesPromises = INDICES.map(idx => fetchSymbol(idx.symbol));
            const indicesData = await Promise.all(indicesPromises);

            // Render Indices
            const nikkei = indicesData[0];
            if (nikkei) {
                nikkeiPriceEl.textContent = `¥${formatNumber(nikkei.price, true)}`;
                nikkeiChangeEl.innerHTML = formatChange(nikkei.price, nikkei.previousClose);
                nikkeiPriceEl.classList.remove('loading-skeleton');
                nikkeiChangeEl.classList.remove('loading-skeleton');
            } else {
                nikkeiPriceEl.innerHTML = '<span class="error-msg">取得不可</span>';
                nikkeiPriceEl.classList.remove('loading-skeleton');
            }

            const usdjpy = indicesData[1];
            if (usdjpy) {
                usdjpyPriceEl.textContent = `¥${formatNumber(usdjpy.price)}`;
                usdjpyChangeEl.innerHTML = formatChange(usdjpy.price, usdjpy.previousClose);
                usdjpyPriceEl.classList.remove('loading-skeleton');
                usdjpyChangeEl.classList.remove('loading-skeleton');
            } else {
                usdjpyPriceEl.innerHTML = '<span class="error-msg">取得不可</span>';
                usdjpyPriceEl.classList.remove('loading-skeleton');
            }

            // Parallel fetch for stocks (chunked to be polite to proxy)
            const stocksData = [];
            const batchSize = 5; // Fetch 5 at a time
            
            for (let i = 0; i < STOCKS.length; i += batchSize) {
                const batch = STOCKS.slice(i, i + batchSize);
                const promises = batch.map(s => fetchSymbol(s.code));
                const results = await Promise.all(promises);
                stocksData.push(...results);
                
                // Small delay to avoid rate limiting on proxy
                if (i + batchSize < STOCKS.length) {
                    await new Promise(r => setTimeout(r, 500));
                }
            }

            renderStocks(stocksData);
            
            // Update timestamp
            const now = new Date();
            lastUpdatedEl.textContent = `最終更新: ${now.toLocaleString('ja-JP')}`;
            refreshBtnEl.classList.remove('loading');
            refreshBtnEl.textContent = '更新 ↻';
        }

        // Initialize
        fetchAllData();
    </script>
</body>
</html>
