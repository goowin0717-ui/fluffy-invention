
forex_html = '''<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドル円 為替レート</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;

        }
        .container {
            width: 100%;

        }
        .card {

        }
        .rate-display {
            background: linear-gradient(135deg, rgba(0,217,255,0.15), rgba(0,217,255,0.05));
            border-radius: 20px;

        }
        .rate-label {
            color: #a0a0c0;

        }
        .rate-value {

        }
        .rate-unit {

        .rate-change {

        .rate-change.up { color: #00ff88; }
        .rate-change.down { color: #ff4757; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .info-item {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 16px;

            border: 1px solid rgba(255,255,255,0.06);
        }
        .info-item .label {
            color: #8888aa;

        }
        .info-item .value {
            color: #fff;

        }
        .chart-container {
            background: rgba(255,255,255,0.03);

        .chart-title {

        #chart {

        .refresh-btn {

            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>💱 USD/JPY</h1>
                <div class="subtitle">ドル円 為替レート</div>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="rate-display">
                <div class="rate-label">現在のレート</div>
                <div class="rate-value" id="rateValue">
                    <div class="loading"></div>
                </div>
                <div class="rate-unit">1 USD = ? JPY</div>
                <div class="rate-change neutral" id="rateChange">--</div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="label">前日比</div>
                    <div class="value" id="dayChange">--</div>
                </div>
                <div class="info-item">
                    <div class="label">変動率</div>
                    <div class="value" id="changePercent">--</div>
                </div>
                <div class="info-item">
                    <div class="label">高値（直近30日）</div>
                    <div class="value" id="high30">--</div>
                </div>
                <div class="info-item">
                    <div class="label">安値（直近30日）</div>
                    <div class="value" id="low30">--</div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">📈 直近30日の推移</div>
                <canvas id="chart"></canvas>
            </div>

            <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">
                <span class="icon">🔄</span>
                <span>最新データを取得</span>
            </button>

            <div class="last-update" id="lastUpdate">データを取得中...</div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var rateValue = document.getElementById('rateValue');
        var rateChange = document.getElementById('rateChange');
        var dayChange = document.getElementById('dayChange');
        var changePercent = document.getElementById('changePercent');
        var high30 = document.getElementById('high30');
        var low30 = document.getElementById('low30');
        var lastUpdate = document.getElementById('lastUpdate');
        var errorMsg = document.getElementById('errorMsg');
        var refreshBtn = document.getElementById('refreshBtn');
        var canvas = document.getElementById('chart');
        var ctx = canvas.getContext('2d');

        var historyData = [];
        var currentRate = null;
        var previousRate = null;
        var dpr = window.devicePixelRatio || 1;

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }
        function hideError() {
            errorMsg.style.display = 'none';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                refreshBtn.classList.add('spinning');
                refreshBtn.disabled = true;
            } else {
                refreshBtn.classList.remove('spinning');
                refreshBtn.disabled = false;
            }
        }

        function formatDate(dateStr) {
            var d = new Date(dateStr + 'T00:00:00');
            return (d.getMonth() + 1) + '/' + d.getDate();
        }

        function formatNumber(num, digits) {
            digits = digits || 2;
            return num.toFixed(digits);
        }

        function drawChart() {
            // Canvasの論理サイズを取得
            var rect = canvas.getBoundingClientRect();
            var w = Math.floor(rect.width);
            var h = Math.floor(rect.height);

            // Canvasの実際のピクセルサイズをDPRに合わせて設定
            canvas.width = w * dpr;
            canvas.height = h * dpr;

            // コンテキストをリセットしてからscale
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.clearRect(0, 0, w, h);

            if (historyData.length < 2) return;

            var values = [];
            for (var i = 0; i < historyData.length; i++) {
                values.push(historyData[i].rate);
            }
            var min = Math.min.apply(null, values);
            var max = Math.max.apply(null, values);
            var range = max - min || 1;
            var padding = 30;
            var chartW = w - padding * 2;
            var chartH = h - padding * 2;

            // グリッド線
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (var i = 0; i <= 4; i++) {
                var y = padding + (chartH / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(w - padding, y);
                ctx.stroke();
            }

            // 折れ線
            var gradient = ctx.createLinearGradient(0, padding, 0, h - padding);
            gradient.addColorStop(0, 'rgba(0,217,255,0.3)');
            gradient.addColorStop(1, 'rgba(0,217,255,0.0)');

            ctx.beginPath();
            for (var i = 0; i < historyData.length; i++) {
                var x = padding + (chartW / (historyData.length - 1)) * i;
                var y = padding + chartH - ((historyData[i].rate - min) / range) * chartH;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = '#00d9ff';
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();

            // 塗りつぶし
            ctx.lineTo(padding + chartW, h - padding);
            ctx.lineTo(padding, h - padding);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // ポイント
            for (var i = 0; i < historyData.length; i++) {
                var x = padding + (chartW / (historyData.length - 1)) * i;
                var y = padding + chartH - ((historyData[i].rate - min) / range) * chartH;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#00d9ff';
                ctx.fill();
            }

            // X軸ラベル
            ctx.fillStyle = '#8888aa';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            var step = Math.ceil(historyData.length / 5);
            for (var i = 0; i < historyData.length; i += step) {
                var x = padding + (chartW / (historyData.length - 1)) * i;
                ctx.fillText(formatDate(historyData[i].date), x, h - padding + 6);
            }
        }

        function updateUI() {
            if (!currentRate) return;

            rateValue.textContent = formatNumber(currentRate, 3);

            var change = previousRate ? currentRate - previousRate : 0;
            var pct = previousRate ? (change / previousRate) * 100 : 0;

            if (change > 0) {
                rateChange.textContent = '▲ ' + formatNumber(change, 3) + ' (' + formatNumber(pct, 2) + '%)';
                rateChange.className = 'rate-change up';
                dayChange.textContent = '+' + formatNumber(change, 3);
                dayChange.style.color = '#00ff88';
            } else if (change < 0) {
                rateChange.textContent = '▼ ' + formatNumber(Math.abs(change), 3) + ' (' + formatNumber(Math.abs(pct), 2) + '%)';
                rateChange.className = 'rate-change down';
                dayChange.textContent = formatNumber(change, 3);
                dayChange.style.color = '#ff4757';
            } else {
                rateChange.textContent = '→ 0.000 (0.00%)';
                rateChange.className = 'rate-change neutral';
                dayChange.textContent = '0.000';
                dayChange.style.color = '#a0a0c0';
            }

            changePercent.textContent = (pct >= 0 ? '+' : '') + formatNumber(pct, 2) + '%';
            changePercent.style.color = pct >= 0 ? '#00ff88' : '#ff4757';

            if (historyData.length > 0) {
                var values = [];
                for (var i = 0; i < historyData.length; i++) {
                    values.push(historyData[i].rate);
                }
                high30.textContent = formatNumber(Math.max.apply(null, values), 2);
                low30.textContent = formatNumber(Math.min.apply(null, values), 2);
            }

            var now = new Date();
            lastUpdate.textContent = '最終更新: ' + now.getFullYear() + '/' +
                String(now.getMonth() + 1).padStart(2, '0') + '/' +
                String(now.getDate()).padStart(2, '0') + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');

            // レイアウトが確定してから描画
            requestAnimationFrame(function() {
                drawChart();
            });
        }

        window.fetchData = function() {
            setLoading(true);
            hideError();

            var endDate = new Date();
            var startDate = new Date();
            startDate.setDate(startDate.getDate() - 30);

            var endStr = endDate.toISOString().split('T')[0];
            var startStr = startDate.toISOString().split('T')[0];

            var url = 'https://api.frankfurter.dev/v1/' + startStr + '..' + endStr + '?from=USD&to=JPY';

            fetch(url)
                .then(function(res) {
                    if (!res.ok) throw new Error('API error: ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    if (!data.rates) throw new Error('Invalid data format');

                    historyData = [];
                    var dates = Object.keys(data.rates).sort();
                    for (var i = 0; i < dates.length; i++) {
                        var date = dates[i];
                        var rate = data.rates[date]['JPY'];
                        historyData.push({ date: date, rate: rate });
                    }

                    if (historyData.length > 0) {
                        currentRate = historyData[historyData.length - 1].rate;
                        previousRate = historyData.length > 1 ? historyData[historyData.length - 2].rate : currentRate;
                    }

                    updateUI();
                    setLoading(false);
                })
                .catch(function(err) {
                    console.error(err);
                    showError('データの取得に失敗しました。しばらくしてから再度お試しください。');
                    setLoading(false);
                });
        };

        // ウィンドウリサイズ時に再描画
        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                drawChart();
            }, 150);
        });

        // 初回取得
        fetchData();

        // 自動更新（5分ごと）
        setInterval(fetchData, 300000);
    })();
    </script>
</body>
</html>'''

with open('/mnt/agents/output/usd_jpy_forex.html', 'w', encoding='utf-8') as f:
    f.write(forex_html)

print("ドル円為替レートWEBアプリを修正しました！")
