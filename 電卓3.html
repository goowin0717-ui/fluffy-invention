<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡単な電卓</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .calculator {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 350px;
        }

        .display {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 2.5em;
            padding: 20px;
            text-align: right;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-all;
            overflow-wrap: break-word;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 15px;
            color: #fff;
            font-size: 1.4em;
            font-weight: 600;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            min-height: 60px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
            background: rgba(255, 255, 255, 0.4);
        }

        .btn.operator {
            background: rgba(255, 107, 107, 0.8);
        }

        .btn.operator:hover {
            background: rgba(255, 107, 107, 0.9);
        }

        .btn.equals {
            background: rgba(72, 187, 120, 0.8);
        }

        .btn.equals:hover {
            background: rgba(72, 187, 120, 0.9);
        }

        .btn.clear {
            background: rgba(237, 137, 54, 0.8);
        }

        .btn.clear:hover {
            background: rgba(237, 137, 54, 0.9);
        }

        .btn.zero {
            grid-column: span 2;
        }

        @media (max-width: 400px) {
            .calculator {
                padding: 20px;
            }
            
            .display {
                font-size: 2em;
                padding: 15px;
                min-height: 50px;
            }
            
            .btn {
                font-size: 1.2em;
                padding: 15px;
                min-height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn clear" onclick="clearDisplay()">C</button>
            <button class="btn clear" onclick="clearEntry()">CE</button>
            <button class="btn operator" onclick="deleteLast()">⌫</button>
            <button class="btn operator" onclick="appendOperator('/')">÷</button>
            
            <button class="btn" onclick="appendNumber('7')">7</button>
            <button class="btn" onclick="appendNumber('8')">8</button>
            <button class="btn" onclick="appendNumber('9')">9</button>
            <button class="btn operator" onclick="appendOperator('*')">×</button>
            
            <button class="btn" onclick="appendNumber('4')">4</button>
            <button class="btn" onclick="appendNumber('5')">5</button>
            <button class="btn" onclick="appendNumber('6')">6</button>
            <button class="btn operator" onclick="appendOperator('-')">-</button>
            
            <button class="btn" onclick="appendNumber('1')">1</button>
            <button class="btn" onclick="appendNumber('2')">2</button>
            <button class="btn" onclick="appendNumber('3')">3</button>
            <button class="btn operator" onclick="appendOperator('+')">+</button>
            
            <button class="btn zero" onclick="appendNumber('0')">0</button>
            <button class="btn" onclick="appendDecimal()">.</button>
            <button class="btn equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentInput = '';
        let previousInput = '';
        let operator = '';
        let waitingForNewInput = false;

        const display = document.getElementById('display');

        function updateDisplay(value) {
            display.textContent = value;
        }

        function appendNumber(number) {
            if (waitingForNewInput) {
                currentInput = number;
                waitingForNewInput = false;
            } else {
                currentInput = currentInput === '0' ? number : currentInput + number;
            }
            updateDisplay(currentInput);
        }

        function appendDecimal() {
            if (waitingForNewInput) {
                currentInput = '0.';
                waitingForNewInput = false;
            } else if (currentInput.indexOf('.') === -1) {
                currentInput = currentInput === '' ? '0.' : currentInput + '.';
            }
            updateDisplay(currentInput);
        }

        function appendOperator(op) {
            if (currentInput === '' && previousInput === '') return;
            
            if (previousInput !== '' && currentInput !== '' && !waitingForNewInput) {
                calculate();
            }
            
            operator = op;
            previousInput = currentInput === '' ? previousInput : currentInput;
            currentInput = '';
            waitingForNewInput = false;
            
            updateDisplay(previousInput);
        }

        function calculate() {
            if (previousInput === '' || currentInput === '' || operator === '') return;
            
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            let result;
            
            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        updateDisplay('エラー');
                        reset();
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }
            
            result = Math.round(result * 100000000) / 100000000; // 浮動小数点誤差対策
            currentInput = result.toString();
            previousInput = '';
            operator = '';
            waitingForNewInput = true;
            updateDisplay(currentInput);
        }

        function clearDisplay() {
            reset();
            updateDisplay('0');
        }

        function clearEntry() {
            currentInput = '';
            updateDisplay('0');
        }

        function deleteLast() {
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                updateDisplay(currentInput === '' ? '0' : currentInput);
            }
        }

        function reset() {
            currentInput = '';
            previousInput = '';
            operator = '';
            waitingForNewInput = false;
        }

        // キーボードサポート
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendNumber(key);
            } else if (key === '.') {
                appendDecimal();
            } else if (key === '+') {
                appendOperator('+');
            } else if (key === '-') {
                appendOperator('-');
            } else if (key === '*') {
                appendOperator('*');
            } else if (key === '/') {
                event.preventDefault();
                appendOperator('/');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape') {
                clearDisplay();
            } else if (key === 'Backspace') {
                event.preventDefault();
                deleteLast();
            }
        });
    </script>
</body>
</html>
