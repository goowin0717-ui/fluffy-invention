{title}」タスクを一時停止してください。\",\"18X1PZ\":\"このリマインダーを一時停止してください。\",\"rws22\":\"リマインダーオプション\",\"1WbZFS\":\"チャットを見る\",\"1R8Wnk\":\"編集\",\"35iyE5\":\"一時停止\",\"3cKvcb\":\"削除\",\"3j5mUF\":\"デバッグ情報[内部のみ]\",\"BQ14p\":\"タスクを削除しますか？\",\"3dkFnJ\":\"このタスクは完全に削除され、タスクのリマインダーが届かなくなります。\",\"3wA3Iq\":\"削除\",\"3wqKrB\":\"アクティブ\",\"39o0ZN\":\"アクティブでない\",\"1nXUwg\":\"「{title}」タスクを再開して。\",\"3GHUPJ\":\"このリマインダーを再開してください。\",\"4xSDF1\":\"再開\",\"44jOJa\":\"{title}を見る\",\"3VRNT2\":\"リマインダーを見る\",\"83hxU\":\"日時指定されたコンテンツはまだありません\",\"dU8nw\":\"Meta AIにタスクの時間設定を依頼すると、ここに表示されます。\",\"4C1Q59\":\"@{username}\",\"2urcSN\":\"リミックスされた回数{totalCount}回、公開{publicCount}件\",\"JPIlq\":\"Meta AIを試す\",\"1l2uO1\":\"自由に質問\",\"FWLf0\":\"アクションを実行\",\"3E9q0K\":\"画像を作成\",\"3mRpZo\":\"新しい\",\"HbWeE\":\"これを分析\",\"3Afl0W\":\"商品を探す\",\"3susVm\":\"何か楽しいことをする\",\"1FRxa5\":\"あなたのブランドのMeta AI\",\"2Fvoe3\":\"ファイルをアップロード\",\"3z6KQF\":\"作成ツールにフォーカス\",\"19ltgc\":\"前のメッセージ\",\"3UgcV9\":\"次のメッセージ\",\"2A3cmD\":\"生成を停止\",\"3nVOeS\":\"続けて質問する...\",\"MlhM5\":\"ログインして確認\",\"4D8Q11\":\"iOSのTestFlightの利用コードを求められています。\",\"1yNq4A\":\"TestFlightをダウンロードした後、元の招待メールに戻って、次をクリックしてください:\",\"26GEc\":\"招待を承認\",\"3wOODl\":\"もう一度実行してください。Project Hatchにリダイレクトされます。\",\"3bESdq\":\"HatchアプリをAndroidでダウンロードできませんでした。\",\"1Wsj5I\":\"Metaからの招待メールの下部に記載されたメールアドレスを使用してPlayストアにログインしていることを確認してください。\",\"2DtJDM\":\"Playストアアプリの上部にあるプロフィールリンクをクリックして、Playストアアカウントを操作できます。クリックする必要があるのは\",\"RNWwS\":\"アカウントを切り替える\",\"22n46b\":\"そのリストに記載された正しいアカウントに移動してください。記載されていない場合は、\",\"2AbImA\":\"別のアカウントを追加\",\"1LbiZb\":\"そしてログインします。\",\"KqNPE\":\"Project Hatchで問題が発生しています\",\"1Pa062\":\"Hatchモバイルアプリの不具合を報告するには、[設定]に移動して以下をタップしてください:\",\"2h8qnq\":\"報告を送信\",\"1gD74i\":\".\",\"A8kRy\":\"ブラウザーでバグを報告するには、左下の設定アイコンをクリックしてから次をクリックしてください:\",\"277Y4D\":\"問題を報告\",\"hvo3d\":\".\",\"XPtNB\":\"{projectHatchLink}へのオンボーディングに関するトラブルシューティングのヒント\",\"34KrfE\":\"Project Hatch\",\"3nEVKf\":\"アカウントメニュー\",\"OyrUL\":\"サインアウト\",\"3Rjeaw\":\"Meta © 2026\",\"1ESTXl\":\"プライバシー\",\"2lXgDt\":\"利用規約\",\"3T7aNY\":\"AI利
