<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>今日の日付</title>
    
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
 
p {
  display: flex;
           justify-content: center;
           align-items: center; 
           height:2.5rem;
           width:8rem;
  color: navy;
  padding: 5px;
  background: lime;
  border-radius: 15px;
}


 .today{
           display: flex;
           justify-content: center;
           align-items: center; 
           width:20rem;
           height:2.5rem;
            background: yellow;
            border: none;
            border-radius: 15px;
            color: black;  
}                      


    </style>
    
    
  </head>
  <body>
 
  <div>
 
  <p>  今日の日付　</p>
  
  <p id = "d2"  class ="today" style="margin-left:20px" ></p>

  </div>

<script>

   const now = new Date();

// 基本の取得
const year = now.getFullYear();     // 年 (2026)
const month = now.getMonth() + 1;   // 月 (0〜11 → +1が必要！)
const date = now.getDate();          // 日 (1〜31)
const day = now.getDay();            // 曜日 (0=日曜〜6=土曜)

const youbi = ["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"];


const wareki = year - 2018

const today = (`${year}年(平成${wareki}年)${month}月${date}日(${youbi[ day]})`)


document.getElementById("d2").textContent =  today

  
</script>

  </body>
</html>
