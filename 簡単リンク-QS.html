<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡単リンク</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/700.css">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eef8 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 24px; }

        .header { text-align: center; margin-bottom: 4px; }
        .header h1 { font-size: 26px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
        .header p { font-size: 13px; color: var(--text-sub); }

        .input-card {
            background: var(--card); padding: 16px; border-radius: var(--radius);
            box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center;
        }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .input-group input {
            padding: 10px 12px; border: 2px solid var(--border); border-radius: 8px;
            font-size: 14px; font-family: inherit; outline: none; transition: 0.2s; background: #fff;
        }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        
        .btn-add {
            padding: 12px 18px; background: var(--primary); color: #fff; border: none;
            border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .btn-add:hover { background: var(--primary-hover); }
        .btn-add:active { transform: scale(0.97); }

        .link-list { display: flex; flex-direction: column; gap: 10px; }

        .link-item {
            background: var(--card); padding: 14px 16px; border-radius: var(--radius);
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow); cursor: pointer; transition: all 0.2s;
            border-left: 4px solid var(--primary); position: relative;
        }
        .link-item:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .link-item:active { transform: scale(0.99); }

        .link-name { font-size: 15px; font-weight: 600; color: var(--text-main); padding-right: 40px; }
        .btn-edit {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            width: 28px; height: 28px; border: none; background: #f1f5f9; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--text-sub); transition: 0.2s;
        }
        .btn-edit:hover { background: #e2e8f0; color: var(--primary); }

        .empty-state {
            text-align: center; padding: 40px 20px; color: var(--text-sub);
            background: rgba(255,255,255,0.6); border-radius: var(--radius); border: 2px dashed var(--border);
        }
        .empty-state span { font-size: 32px; display: block; margin-bottom: 8px; opacity: 0.7; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px); display: none; align-items: center;
            justify-content: center; padding: 20px; z-index: 100;
        }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background: var(--card); padding: 24px; border-radius: var(--radius);
            width: 100%; max-width: 340px; box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal h2 { font-size: 18px; margin-bottom: 16px; text-align: center; }
        .modal input {
            width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px;
            font-size: 15px; margin-bottom: 20px; outline: none;
        }
        .modal input:focus { border-color: var(--primary); }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button {
            flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .btn-cancel { background: #f1f5f9; color: var(--text-sub); }
        .btn-cancel:hover { background: #e2e8f0; }
        .btn-delete { background: var(--danger); color: #fff; }
        .btn-delete:hover { background: #dc2626; }
        .btn-save { background: var(--primary); color: #fff; }
        .btn-save:hover { background: var(--primary-hover); }

        @media (max-width: 480px) {
            .input-card { flex-direction: column; align-items: stretch; }
            .btn-add { width: 100%; }
            .modal { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🔗 簡単リンク</h1>
            <p>よく使うサイトをまとめて管理</p>
        </header>

        <div class="input-card">
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="サイト名" maxlength="30">
                <input type="text" id="urlInput" placeholder="URL (https://省略可)">
            </div>
            <button class="btn-add" id="addBtn">登録</button>
        </div>

        <div class="link-list" id="linkList"></div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>リンクを編集</h2>
            <input type="text" id="editNameInput" placeholder="サイト名" maxlength="30">
            <div class="modal-actions">
                <button class="btn-delete" id="modalDeleteBtn">削除</button>
                <button class="btn-cancel" id="modalCancelBtn">キャンセル</button>
                <button class="btn-save" id="modalSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let links = JSON.parse(localStorage.getItem('easy_links_v1')) || [];
        let editingId = null;

        // DOM
        const els = {
            nameInput: document.getElementById('nameInput'),
            urlInput: document.getElementById('urlInput'),
            addBtn: document.getElementById('addBtn'),
            list: document.getElementById('linkList'),
            modal: document.getElementById('editModal'),
            editNameInput: document.getElementById('editNameInput'),
            deleteBtn: document.getElementById('modalDeleteBtn'),
            cancelBtn: document.getElementById('modalCancelBtn'),
            saveBtn: document.getElementById('modalSaveBtn')
        };

        // Functions
        function save() { localStorage.setItem('easy_links_v1', JSON.stringify(links)); }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        function render() {
            els.list.innerHTML = '';
            if (links.length === 0) {
                els.list.innerHTML = `<div class="empty-state"><span>📂</span>まだリンクが登録されていません</div>`;
                return;
            }
            links.forEach(link => {
                const item = document.createElement('div');
                item.className = 'link-item';
                item.innerHTML = `
                    <div class="link-name">${escapeHtml(link.name)}</div>
                    <button class="btn-edit" data-id="${link.id}" title="編集">✏️</button>
                `;
                // Tap to navigate (same tab)
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.btn-edit')) return;
                    window.location.href = link.url;
                });
                // Edit button
                item.querySelector('.btn-edit').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditModal(link.id);
                });
                els.list.appendChild(item);
            });
        }

        function addLink() {
            const name = els.nameInput.value.trim();
            let url = els.urlInput.value.trim();
            if (!name || !url) { alert('サイト名とURLを入力してください'); return; }
            if (!url.match(/^https?:\/\//i)) url = 'https://' + url;

            links.unshift({ id: Date.now().toString(), name, url });
            save(); render();
            els.nameInput.value = '';
            els.urlInput.value = '';
            els.nameInput.focus();
        }

        function openEditModal(id) {
            const link = links.find(l => l.id === id);
            if (!link) return;
            editingId = id;
            els.editNameInput.value = link.name;
            els.modal.classList.add('active');
        }

        function closeEditModal() {
            els.modal.classList.remove('active');
            editingId = null;
        }

        function saveEdit() {
            if (!editingId) return;
            const newName = els.editNameInput.value.trim();
            if (!newName) { alert('サイト名を入力してください'); return; }

            const link = links.find(l => l.id === editingId);
            if (link) link.name = newName;
            save(); render(); closeEditModal();
        }

        function deleteLink() {
            if (!confirm('このリンクを削除しますか？')) return;
            links = links.filter(l => l.id !== editingId);
            save(); render(); closeEditModal();
        }

        // Events
        els.addBtn.addEventListener('click', addLink);
        els.urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addLink(); });
        els.nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') els.urlInput.focus(); });
        els.saveBtn.addEventListener('click', saveEdit);
        els.deleteBtn.addEventListener('click', deleteLink);
        els.cancelBtn.addEventListener('click', closeEditModal);
        els.modal.addEventListener('click', (e) => { if (e.target === els.modal) closeEditModal(); });

        // Init
        render();
    </script>
</body>
</html>
