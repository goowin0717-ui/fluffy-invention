<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時計</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/700.css">
    
    
    <style>
    
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Noto Sans JP', sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        /* Tabs */
  



        /* Panels */
        .panel {
            display: none;
        }

        .panel.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Clock Card */
        
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
        }

        .date-display {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .week-display {
            font-size: 20px;
            color: #7c8aff;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .time-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
       
        .time-value {
            font-size: 72px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            background: linear-gradient(135deg, #fff, #c4c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 90px;
        }

        .time-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 8px;
            letter-spacing: 2px;
        }

        .time-sep {
            font-size: 56px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            padding-bottom: 24px;
            animation: blink 1s infinite;
        }

        .time-sep.solid {
            animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .ampm {
            font-size: 16px;
            color: #7c8aff;
            font-weight: 500;
            align-self: flex-start;
            margin-top: 16px;
            margin-left: 4px;
        }

        .seconds-display {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        /* Timer Card */
        
        
       

        /* Timer Controls */
  

        /* Finish animation */
        
        
        
    </style>
    
</head>

<body>

    <div class="container">
        <!-- Tabs -->
   
   
        <!-- Clock Panel -->
        
        <div class="panel active" id="clockPanel">
            <div class="card">
                <div class="date-display" id="dateDisplay"></div>
                <div class="week-display" id="weekDisplay"></div>
                <div class="time-display">
                    <div class="time-unit">
                        <div class="time-value" id="clockHours">00</div>
                        <div class="time-label">時</div>
                    </div>
                    <div class="time-sep">:</div>
                    <div class="time-unit">
                        <div class="time-value" id="clockMinutes">00</div>
                        <div class="time-label">分</div>
                    </div>
                    <div class="time-sep">:</div>
                    <div class="time-unit">
                        <div class="time-value" id="clockSeconds">00</div>
                        <div class="time-label">秒</div>
                    </div>
                    <div class="ampm" id="clockAmPm"></div>
                </div>
                <div class="seconds-display" id="clockSecondsDisplay"></div>
            </div>
        </div>

        <!-- Timer Panel -->
        
        
        
     
     
                <!-- Timer Circle Display -->
                
             
         
       
    </div>

    <script>
    
        /* ===== Tab Switching ===== */
        
        

        /* ===== Clock ===== */
        
        
        const weekNames = ['日', '月', '火', '水', '木', '金', '土'];

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            document.getElementById('clockHours').textContent = String(hours).padStart(2, '0');
            document.getElementById('clockMinutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('clockSeconds').textContent = String(seconds).padStart(2, '0');

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const week = weekNames[now.getDay()];

      /* ===== wareki===== */
      
            const wareki = year - 2018


            document.getElementById('dateDisplay').textContent = `${year}年(令和${wareki}年)${month}月${day}日`;
            document.getElementById('weekDisplay').textContent = `(${week}曜日)`;

            const isPM = hours >= 12;
            document.getElementById('clockAmPm').textContent = isPM ? '午後' : '午前';
        }

        setInterval(updateClock, 1000);
        updateClock();

        /* ===== Timer ===== */
        
       
    </script>
</body>
</html>
