<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡単PDF作成アプリ</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:900px;margin:auto;padding:22px 14px 40px}h1{text-align:center;font-size:25px;margin:4px 0 20px}.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 16px #00000012;margin-bottom:16px}label{display:block;font-weight:600;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #d5d8dd;border-radius:10px;padding:12px;font-size:16px;outline:0}textarea{min-height:320px;resize:vertical;line-height:1.75}.controls{display:grid;grid-template-columns:1fr 150px;gap:12px;margin-bottom:14px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;cursor:pointer}.primary{background:#222;color:#fff}.secondary{background:#e9eaec;color:#222}.hint{font-size:13px;color:#777;margin-top:8px}.preview-wrap{overflow:auto;background:#e7e8ea;border-radius:12px;padding:20px}.page{background:#fff;width:794px;min-height:1123px;margin:auto;padding:72px 68px;box-shadow:0 2px 8px #0000001f;white-space:pre-wrap;overflow-wrap:anywhere}.page h2{font-size:27px;line-height:1.4;margin:0 0 28px}.page .body{font-size:16px;line-height:1.9}@media(max-width:650px){.controls{grid-template-columns:1fr}.preview-wrap{padding:8px}}@media print{body{background:#fff}.app{display:none}#printArea{display:block}.page{box-shadow:none;margin:0;width:210mm;min-height:297mm;padding:18mm} }#printArea{display:none}</style></head><body><div class="app"><h1>📄 簡単PDF作成アプリ</h1><div class="panel"><div class="controls"><div><label>タイトル</label><input id="title" placeholder="例：旅行メモ"></div><div><label>文字サイズ</label><select id="fontSize"><option value="14">小さめ</option><option value="16" selected>標準</option><option value="18">大きめ</option><option value="20">特大</option></select></div></div><label>本文</label><textarea id="text" placeholder="ここに文章をコピー＆貼り付けしてください。\n\n例：\n旅行について\n東京にはたくさんの観光スポットがあります。\n\n浅草\n浅草寺は東京を代表する観光名所です。"></textarea><div class="buttons"><button class="secondary" id="clear">クリア</button><button class="primary" id="preview">プレビュー更新</button><button class="primary" id="pdf">📄 PDF作成</button></div><div class="hint">A4縦向き。PDF作成時はブラウザの印刷画面で「PDFとして保存」を選べます。</div></div><div class="panel"><label>プレビュー</label><div class="preview-wrap"><div class="page"><h2 id="pt">タイトル</h2><div class="body" id="pb">本文を入力すると、ここにプレビューが表示されます。</div></div></div></div></div><div id="printArea"><div class="page"><h2 id="printTitle"></h2><div class="body" id="printBody"></div></div></div><script>const $=id=>document.getElementById(id);function update(){let t=$("title").value.trim()||"タイトル",x=$("text").value||"本文を入力すると、ここにプレビューが表示されます。";$("pt").textContent=t;$("pb").textContent=x;$("pb").style.fontSize=$("fontSize").value+"px"}$("preview").onclick=update;["title","text"].forEach(id=>$(id).addEventListener("input",update));$("fontSize").onchange=update;$("clear").onclick=()=>{if(confirm("入力内容をクリアしますか？")){ $("title").value="";$("text").value="";update()}};$("pdf").onclick=()=>{let x=$("text").value.trim();if(!x){alert("本文を入力してください。");$("text").focus();return}$("printTitle").textContent=$("title").value.trim()||"簡単PDF";$("printBody").textContent=x;$("printBody").style.fontSize=$("fontSize").value+"px";document.title=$("printTitle").textContent;window.print()};update();</script></body></html>
