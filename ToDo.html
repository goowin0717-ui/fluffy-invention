<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do リスト</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-jp@5.0.17/700.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
           /*  --card-bg: #ffffff; */
            --card-bg: lime;
            --primary: #6c5ce7;
            --primary-hover: #5649c0;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --history-bg: #f8f9fa;
            --danger: #ff7675;
            --danger-hover: #d63031;
            --border: #dfe6e9;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }

        .header {
            padding: 24px 24px 16px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
        }

        .input-area {
            padding: 0 24px 20px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-fields {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-fields input,
        .input-fields textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
        }

        .input-fields input:focus,
        .input-fields textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .input-fields textarea {
            resize: vertical;
            min-height: 70px;
            line-height: 1.5;
        }

        .btn-add {
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn-add:hover {
            background: var(--primary-hover);
        }

        .btn-add:active {
            transform: scale(0.96);
        }

        .lists-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .count-badge {
            font-size: 11px;
            background: var(--border);
            color: var(--text-sub);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .btn-clear-history {
            font-size: 12px;
            color: var(--danger);
            background: transparent;
            border: 1px solid var(--danger);
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-clear-history:hover {
            background: var(--danger);
            color: #fff;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            padding: 14px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            gap: 12px;
            transition: background 0.2s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-checkbox {
            width: 22px;
            height: 22px;
            min-width: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-top: 2px;
        }

        .task-checkbox:hover {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.05);
        }

        .task-checkbox.checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-word;
            margin-bottom: 4px;
        }

        .task-title.completed {
            text-decoration: line-through;
            color: var(--text-sub);
            font-weight: 500;
        }

        .task-memo {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .task-date {
            font-size: 11px;
            color: #b2bec3;
            margin-top: 6px;
        }

        .btn-delete {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #fff0f0;
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 20px 0;
            color: var(--text-sub);
            font-size: 13px;
        }

        .empty-icon {
            font-size: 28px;
            margin-bottom: 6px;
            display: block;
            opacity: 0.6;
        }

        /* Scrollbar */
        .lists-container::-webkit-scrollbar {
            width: 6px;
        }
        .lists-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .lists-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        @media (max-width: 480px) {
            .input-area {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-add {
                width: 100%;
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>📝 To-Do リスト</h1>
            <p>タスクをタイトルとメモで整理しよう</p>
        </div>

        <div class="input-area">
            <div class="input-fields">
                <input type="text" id="titleInput" placeholder="タイトル (必須)" maxlength="50">
                <textarea id="memoInput" placeholder="メモ (任意・改行可能)"></textarea>
            </div>
            <button class="btn-add" onclick="addTask()">追加</button>
        </div>

        <div class="lists-container">
            <!-- Active Tasks -->
            <div>
                <div class="section-header">
                    <div class="section-title">
                        📋 進行中
                        <span class="count-badge" id="activeCount">0</span>
                    </div>
                </div>
                <ul id="activeList" class="task-list"></ul>
                <div id="activeEmpty" class="empty-state" style="display: none;">
                    <span class="empty-icon">📭</span>
                    タスクはありません
                </div>
            </div>

            <!-- History -->
            <div>
                <div class="section-header">
                    <div class="section-title">
                        📜 完了履歴
                        <span class="count-badge" id="historyCount">0</span>
                    </div>
                    <button class="btn-clear-history" id="clearHistoryBtn" onclick="clearHistory()" style="display: none;">
                        全削除
                    </button>
                </div>
                <ul id="historyList" class="task-list"></ul>
                <div id="historyEmpty" class="empty-state" style="display: none;">
                    <span class="empty-icon">📂</span>
                    完了したタスクはありません
                </div>
            </div>
        </div>
    </div>

    <script>



　　　//トークンチェック(始まり)
　　　//(tokencheck.htmlへジャンプ)

　　　　const savedtoken = localStorage.getItem("token");
　
    if (!savedtoken) {
    //トークン入力ページへ
        window.location.href = "tokencheck.html";
       }
 
     const  tokendt= '';
           localStorage.setItem("token", tokendt);
         

　　　　//トークンチェック(終わり)






        // State
        let tasks = JSON.parse(localStorage.getItem('todo_tasks_v2')) || [];

        // Migration from old version if exists
        const oldTasks = JSON.parse(localStorage.getItem('todo_tasks'));
        if (oldTasks && oldTasks.length > 0 && tasks.length === 0) {
            tasks = oldTasks.map(t => ({
                id: t.id || Date.now().toString(),
                title: t.title || t.text || '無題',
                memo: t.memo || '',
                completed: t.completed || false,
                createdAt: t.createdAt || Date.now(),
                completedAt: t.completedAt || null
            }));
            localStorage.removeItem('todo_tasks');
            localStorage.setItem('todo_tasks_v2', JSON.stringify(tasks));
        }

        // DOM Elements
        const titleInput = document.getElementById('titleInput');
        const memoInput = document.getElementById('memoInput');
        const activeList = document.getElementById('activeList');
        const historyList = document.getElementById('historyList');
        const activeCount = document.getElementById('activeCount');
        const historyCount = document.getElementById('historyCount');
        const activeEmpty = document.getElementById('activeEmpty');
        const historyEmpty = document.getElementById('historyEmpty');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        // Functions
        function save() {
            localStorage.setItem('todo_tasks_v2', JSON.stringify(tasks));
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const d = new Date(timestamp);
            return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function addTask() {
            const title = titleInput.value.trim();
            const memo = memoInput.value.trim();

            if (!title) {
                titleInput.focus();
                return;
            }

            const newTask = {
                id: Date.now().toString(),
                title: title,
                memo: memo,
                completed: false,
                createdAt: Date.now(),
                completedAt: null
            };

            tasks.unshift(newTask);
            save();
            titleInput.value = '';
            memoInput.value = '';
            render();
            titleInput.focus();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                task.completedAt = task.completed ? Date.now() : null;
                save();
                render();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            save();
            render();
        }

        function clearHistory() {
            if (confirm('完了履歴を全て削除しますか？')) {
                tasks = tasks.filter(t => !t.completed);
                save();
                render();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function render() {
            const activeTasks = tasks.filter(t => !t.completed);
            const completedTasks = tasks.filter(t => t.completed);

            // Update counts
            activeCount.textContent = activeTasks.length;
            historyCount.textContent = completedTasks.length;

            // Update visibility
            activeEmpty.style.display = activeTasks.length === 0 ? 'block' : 'none';
            historyEmpty.style.display = completedTasks.length === 0 ? 'block' : 'none';
            clearHistoryBtn.style.display = completedTasks.length > 0 ? 'inline-block' : 'none';

            // Render Active
            activeList.innerHTML = activeTasks.map(task => `
                <li class="task-item">
                    <div class="task-checkbox" onclick="toggleTask('${task.id}')" title="完了にする"></div>
                    <div class="task-content">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        ${task.memo ? `<div class="task-memo">${escapeHtml(task.memo)}</div>` : ''}
                    </div>
                    <button class="btn-delete" onclick="deleteTask('${task.id}')" title="削除">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        </svg>
                    </button>
                </li>
            `).join('');

            // Render History (Sort by completion date desc)
            completedTasks.sort((a, b) => b.completedAt - a.completedAt);
            historyList.innerHTML = completedTasks.map(task => `
                <li class="task-item" style="background: var(--history-bg);">
                    <div class="task-checkbox checked" onclick="toggleTask('${task.id}')" title="未完了に戻す"></div>
                    <div class="task-content">
                        <div class="task-title completed">${escapeHtml(task.title)}</div>
                        ${task.memo ? `<div class="task-memo">${escapeHtml(task.memo)}</div>` : ''}
                        <div class="task-date">完了: ${formatDate(task.completedAt)}</div>
                    </div>
                    <button class="btn-delete" onclick="deleteTask('${task.id}')" title="削除">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        </svg>
                    </button>
                </li>
            `).join('');
        }

        // Initial Render
        render();
    </script>
</body>
</html>
